name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.7.1
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.1
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.7.1 (Tách Riêng Sàn Shopee & TikTok - Hỗ Trợ Chuẩn File Hoàn TikTok Seller Center)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.7.1

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.1`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.1.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.7.1**:
              1. 🏷️ **Tách riêng biệt danh sách hiển thị giữa Sàn Shopee và Sàn TikTok Shop**:
                 - Hai tab không gian làm việc chính độc lập: **🟠 SÀN SHOPEE** và **⚫ SÀN TIKTOK SHOP**.
                 - Khi mở ứng dụng hoặc nạp dữ liệu sàn nào, hệ thống tự động lọc hiển thị riêng dữ liệu sàn đó, không trộn lẫn hai sàn gây rối mắt.
                 - Ghi nhớ trạng thái sàn ưa thích vào bộ nhớ máy, khởi động lại vẫn giữ đúng sàn đang làm việc.
                 - Vẫn có tùy chọn **🌐 Xem Cả 2 Sàn** khi cần đối soát tổng hợp toàn shop.
              2. 📥 **Hỗ trợ toàn diện 100% File Báo Cáo Trả Hàng / Hoàn Tiền TikTok Shop Seller Center**:
                 - Trích xuất chính xác tuyệt đối toàn bộ thông tin từ file xuất trực tiếp của TikTok: Return Order ID, Order ID, Return Logistics Tracking ID, Lý do hoàn, Trạng thái chi tiết (Chờ khách gửi bưu cục, Đang chuyển về, Chờ duyệt hoàn tiền...), Ghi chú của khách (Buyer Note), Đơn giá hoàn, Tên sản phẩm & Phân loại SKU Premium Cao Cấp.
                 - Tự động nhận diện chuẩn không bỏ sót đơn hàng (kể cả các đơn TikTok đánh dấu là Delivered trước khi khách bấm hoàn).
              3. 📱 **Kế thừa toàn bộ nâng cấp Dual Scan Engine v1.7.0**: Quét cực nhạy cả mã vạch 1D dài và mã QR trên Camera điện thoại, giữ yên 0.5s tự động nhận diện và đồng bộ vào máy tính.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
