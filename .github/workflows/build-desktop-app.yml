name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.2 (Giao Diện Tinh Gọn & Tối Ưu Chống Lag Khi Nhiều Đơn / Ảnh)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.2.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.2**:
              1. 🎨 **Thu gọn thanh công cụ & gom nhóm nút chức năng gọn gàng**:
                 - Chỉ giữ lại **3 nút thao tác chính** ở ngoài (`📱 Quét Bằng ĐT`, `➕ Thêm Đơn`, `🔓 Đang Mở Khóa`).
                 - Gom toàn bộ các công cụ phụ vào **2 menu thả xuống gọn gàng**: `📂 Nhập / Xuất Dữ Liệu ▾` và `⚙️ Hệ Thống ▾`.
                 - Thu gọn chiều cao **Ô Tìm Kiếm Nhanh** và **4 ô thống kê tổng SL** xuống còn 1 dòng mỏng (`28px`), ẩn thanh mẹo tĩnh khi không tìm kiếm.
                 - Gộp các nút lọc sàn, sắp xếp ngày, lọc mốc ngày và phân trang vào **1 hàng duy nhất**, giúp phần bảng dữ liệu đơn hàng rộng rãi hơn rất nhiều.
              2. ⚡ **Triệt tiêu hiện tượng lag khi hiển thị nhiều đơn & nhiều ảnh chụp**:
                 - Chuyển cơ chế ghi file ổ cứng trong `main.js` sang **Bất đồng bộ hoàn toàn (`fs.promises.writeFile` + Queue)** kết hợp **Debounce 300ms**, không bao giờ làm khựng giao diện khi quét liên tục hoặc sửa đơn.
                 - Tối ưu hiển thị ảnh đơn hàng với `loading="lazy" decoding="async"` và CSS `content-visibility: auto`.
                 - Mặc định phân trang **50 đơn/trang (Siêu mượt)** và tách riêng việc cập nhật số liệu tức thì (0ms) với việc vẽ lại bảng tổng kết 300+ SKU phía dưới.
              3. 💾 **Giữ nguyên 100% dữ liệu cũ**: Cài đè trực tiếp lên bản đang dùng, toàn bộ đơn hàng và hình ảnh trong `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json` được giữ nguyên vẹn.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
