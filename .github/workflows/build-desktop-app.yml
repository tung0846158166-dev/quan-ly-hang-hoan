name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.3
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.3
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.3 (Tách Chuẩn Mã Vận Đơn Giao & Hoàn, Nạp Đủ 100% Dữ Liệu Excel, Bảng Đối Soát Chi Tiết Toàn Diện)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.3

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.3`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.3.exe`)
            - **Các cải tiến đột phá trong phiên bản v1.3.3**:
              1. 🚚↩️ **Tách Biệt Chuẩn Xác Mã Vận Đơn Giao Hàng & Mã Vận Đơn Trả Hàng**:
                 - Hiển thị trực quan 2 badge riêng biệt: `↩️ Hoàn: [Mã vận đơn trả hàng]` (xanh ngọc, ưu tiên đối soát kiện khách gửi về kho) và `🚚 Giao: [Mã vận đơn giao hàng]` (xám đậm, mã gửi đi ban đầu).
                 - Cả 2 mã vận đơn cùng với Mã khiếu nại và Mã đơn hàng đều được gắn nút 1-click sao chép và tự động khớp tức thì khi quét mã vạch (camera điện thoại / PC / súng quét) hoặc tìm kiếm nhanh.
              2. 📥 **Nạp Đầy Đủ 100% Dữ Liệu File Excel (Khắc Phục Hoàn Toàn Bỏ Sót Đơn)**:
                 - Giữ lại toàn bộ các đơn thuộc diện `"Yêu cầu của Người mua đã hủy"`, gắn cờ trạng thái chuẩn `Không cần nhận` để không làm rối danh sách chờ hàng về kho.
                 - Tự động gộp các dòng sản phẩm thứ 2, thứ 3 vào đúng đơn hàng nhiều sản phẩm theo quy tắc `"Một đơn một dòng tổng, bấm để xem từng sản phẩm"`, đảm bảo xử lý đủ 289/289 dòng (250 đơn duy nhất + 39 dòng mặt hàng kèm theo).
              3. 👁️ **Bảng Dữ Liệu Đối Soát Toàn Diện Khi Xem Chi Tiết Đơn Hàng**:
                 - Bảng chính giữ nguyên thiết kế 1 đơn 1 dòng tổng tinh gọn, mượt mà 60fps.
                 - Khi bấm `👁️ Chi tiết` (hoặc click icon con mắt), mở rộng Drawer hiển thị toàn diện 100% các cột từ file Excel được nhóm khoa học thành 4 thẻ:
                   * 🏷️ **Đơn Hàng & Khiếu Nại**: Mã khiếu nại, Người mua, Ngày đặt, Giờ khiếu nại, Trạng thái trả hàng/hoàn tiền, Trả hàng toàn bộ, Phương án giải quyết.
                   * 🚚 **Vận Chuyển 2 Chiều**: Chiều trả (ĐVVC, Mã VĐ hoàn, Thời gian hoàn trả thành công), Chiều giao (ĐVVC, Mã VĐ giao ban đầu, Địa chỉ nhận hàng).
                   * 💰 **Tài Chính & Phương Án**: Tiền hoàn trả, Thời gian hoàn tiền, Tổng giá trị đơn hàng, Phương thức thanh toán, Doanh thu, Phí ship 2 chiều, Đền bù.
                   * 📝 **Lý Do & Ghi Chú Chi Tiết**: Lí do khiếu nại, Ghi chú người mua khi trả hàng, Ghi chú người mua khi đặt hàng, Ghi chú người bán, Hạn cần phản hồi.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
