name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.1
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.1
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.1 (Tạo Đơn Nhanh Hàng Loạt, Quét Mã Vạch 40 FPS & Chuẩn Hóa Trạng Thái Chờ Về)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.1

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.1`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.1.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.8.1**:
              1. ⚡ **Bảng Tạo Đơn Nhanh Hàng Loạt ([⚡ TẠO ĐƠN NHANH])**:
                 - Nút bấm nổi bật màu cam ngay trên thanh công cụ chính.
                 - Dán danh sách mã vận đơn / mã đơn hàng hàng loạt (mỗi dòng 1 mã, tự động lọc sạch ký tự thừa hoặc dấu `-`).
                 - Chọn Sàn TMĐT (Shopee, TikTok Shop, Lazada, Khác) và Loại đơn (Trả hàng/Hoàn tiền, Giao không thành công, Đơn hủy, THẤT THU) đồng loạt hoặc riêng lẻ từng dòng.
                 - Bảng xem trước danh sách kèm ô checkbox để người dùng tích chọn những đơn muốn đưa ra bảng chính.
                 - Đơn mới tạo ra bảng chính luôn giữ đúng trạng thái chuẩn **"Chưa nhận (Chờ về)"**.
              2. ⏳ **Quy Trình Nhận Tại Kho Chuẩn Xác**:
                 - Đơn mới tạo hoặc đơn mới nhập từ điện thoại có trạng thái Nhận Tại Kho mặc định là **"Chưa nhận (Chờ về)"**.
                 - Chỉ khi nhân viên kho thực hiện thao tác quét mã hoàn kho thực tế trên điện thoại, trạng thái mới tự động cập nhật sang **"Đã nhận về kho"**.
              3. 📱 **Nâng Cấp Quét Mã Vạch Điện Thoại Siêu Nhạy (40 FPS)**:
                 - Tốc độ bắt nét và nhận diện mã vạch 1D/2D siêu tốc tương đương Salework.
                 - Thuật toán xoay quét 90 độ hỗ trợ quét tem dán ngang, dọc linh hoạt.
                 - Khắc phục hoàn toàn tình trạng đơ giật camera khi dùng lâu.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
