name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.4
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.4
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.4 (Kho Lưu Trữ Đơn Đã Về Kho Quá 24h & Tối Ưu Bảng Chính Siêu Nhẹ)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.4

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.4`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.4.exe`)
            - **Tính năng đột phá mới nhất trong phiên bản v1.8.4**:
              1. 📦 **Hệ Thống Kho Lưu Trữ Đơn Hoàn Tự Động (Đã Về Kho Quá 24 Giờ)**:
                 - **Tự động dời đơn cũ**: Tất cả các đơn đã nhận về kho có thời gian `>= 24 giờ` (1 ngày) sẽ được tự động chuyển sang Kho Lưu Trữ riêng, không còn xuất hiện trên Bảng chính.
                 - **Bảng chính siêu nhẹ và mượt mà**: Giúp phần mềm luôn chạy nhanh như chớp, không lo giật lag dù tích lũy hàng nghìn đơn qua nhiều tháng.
                 - **Đầy đủ công cụ quản lý chuyên nghiệp trong Kho Lưu Trữ**:
                   - 🔍 **Tìm kiếm tức thì**: Tra cứu nhanh theo Mã đơn, Mã vận đơn, Tên sản phẩm, Ghi chú.
                   - 📅 **Lọc Ngày & Giờ**: Lọc chính xác theo khoảng ngày và giờ về kho (Từ ngày... đến ngày...).
                   - 🌐 **Lọc theo Sàn**: Phân tách nhanh giữa đơn hoàn Shopee và TikTok Shop.
                   - ☑️ **Tích chọn linh hoạt**: Chọn tất cả hoặc tích chọn từng đơn.
                   - ↩️ **Nút Khôi phục về Bảng chính**: 1-click đưa đơn cũ quay trở lại Bảng chính khi cần xử lý khiếu nại.
                   - 📊 **Nút Xuất File Excel**: Xuất danh sách đơn lưu trữ ra file Excel báo cáo.
                   - 💾 **Nút Lưu vào Ổ Cứng**: Sao lưu an toàn dữ liệu kho lưu trữ về máy tính.
                   - 🗑️ **Nút Xóa đơn**: Xóa an toàn các đơn quá hạn không còn cần thiết.
              2. ⚡ **Tự động quét định kỳ**: Hệ thống tự động quét mỗi 10 phút và có nút bấm thủ công `[⚡ Quét & Dời Đơn >24h Ngay]`.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
