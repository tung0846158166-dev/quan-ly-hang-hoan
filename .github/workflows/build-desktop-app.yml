name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.5
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.5
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.5 (Đồng Bộ Chuẩn Xác 100% Bộ Thống Kê & Bộ Lọc Tức Thì)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.5

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.5`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.5.exe`)
            - **Các nâng cấp & sửa lỗi cốt lõi trong phiên bản v1.8.5**:
              1. 🎯 **Đồng Bộ Chuẩn Xác 100% Bộ Thống Kê & Bộ Lọc**:
                 - Sửa triệt để lỗi cộng nhầm đơn "Bị mất / Hư hỏng" vào badge "Chưa nhận" trên thanh trạng thái.
                 - Khắc phục lỗi Footer "TỔNG CỘNG" và Sticky Bottom Dock hiển thị sai số lượng / tổng tiền khi đang chọn lọc tab trạng thái (Đã nhận, Chưa nhận, Bị mất...) hoặc lọc theo ngày giờ.
                 - Đồng bộ tuyệt đối giữa số đơn hiển thị trên bảng, số lượng sản phẩm, tổng tiền tiền hàng, số lượng Đã về / Chưa về theo thời gian thực (Real-time Sync).
              2. ⚡ **Tự Động Tính Toán & Cập Nhật Tức Thì**:
                 - Khi bấm chuyển tab trạng thái hoặc chọn ngày, toàn bộ bảng thống kê và dock tóm tắt dưới đáy tự động tính toán lại ngay lập tức mà không có độ trễ.
              3. 📦 **Kế Thừa Toàn Bộ Tính Năng v1.8.4**:
                 - Kho Lưu Trữ Đơn Quá 24 Giờ tự động dời đơn cũ giúp Bảng chính siêu nhẹ và siêu mượt.
                 - Giữ nguyên vẹn 100% giao diện và tính năng Mobile Scanner theo tùy biến của người dùng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
