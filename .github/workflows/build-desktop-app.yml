name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.7.4
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.4
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.7.4 (Tự Động Điền Ngày Gửi Đi & Trạng Thái Sàn TikTok Shop)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.7.4

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.4`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.4.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.7.4**:
              1. 📅 **Tự động điền 100% Ngày Gửi Đi (Ship Date) cho đơn TikTok Shop**:
                 - Thuật toán phục hồi ngày gửi đi đa tầng: Nếu file báo cáo hoàn tiền không có cột `Shipped Time`, hệ thống tự động sử dụng mốc thời gian khách yêu cầu trả hàng (`Time Requested`) hoặc ngày tạo đơn, bảo đảm cột Ngày Gửi Đi không bao giờ bị để trống `DD/MM/YYYY HH:mm`.
                 - Khớp chéo tự động (`Cross-enrichment`): Khi nạp file Quản lý đơn hàng có cột `Shipped Time` chuẩn, hệ thống tự động cập nhật giờ gửi hàng chính xác từng giây vào đơn hoàn tương ứng.
              2. 🏷️ **Sửa lỗi hiển thị Loại đơn & Trạng thái sàn**: Loại bỏ triệt để việc gán mặc định nhầm thành `THẤT THU` và `Chờ sàn cập nhật`. Các đơn hoàn TikTok hiển thị chuẩn xác `Trả hàng/Hoàn tiền` hoặc `Giao không thành công` (đơn bom) và trạng thái chi tiết (`Chờ khách gửi hàng`, `Chờ shop duyệt hoàn tiền`, `Giao gói hàng thất bại`).
              3. 📦 **Tương thích toàn diện cả 2 định dạng file xuất của TikTok Shop Seller Center** (Báo Cáo Trả Hàng Hoàn Tiền & Quản Lý Đơn Hàng).
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
