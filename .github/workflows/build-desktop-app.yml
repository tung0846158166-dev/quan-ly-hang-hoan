name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.5.1
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.1
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.5.1 (Khắc Phục Xóa Sạch Lịch Sử Sửa Ô Khi Reset Bảng Đơn, Nút Xóa Lịch Sử Ô Chủ Động 1-Click)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.5.1

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.5.1`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.5.1.exe`)
            - **Các cải tiến & sửa lỗi mới nhất trong phiên bản v1.5.1**:
              1. 🧹 **Xóa Sạch Triệt Để Lịch Sử Chỉnh Sửa Ô Khi Bấm Xóa Hết Đơn Hiện Tại**:
                 - Khi bấm "🗑️ Xóa Hết Đơn Hiện Tại" để nạp file mới, toàn bộ lịch sử chỉnh sửa ô cũ (`cellEditHistory`) được làm sạch 100% về 0.
                 - Các đơn hàng mới nạp hoặc tạo thêm sau đó hoàn toàn không còn mang vết lịch sử cũ của các đơn đã xóa.
                 - Tự động tịnh tiến đồng bộ lịch sử ô khi xóa từng đơn hàng (`deleteOrder`) hoặc chèn dòng đơn mới (`insertOrderRowAt`).
              2. 🗑️ **Nút 'Xóa Lịch Sử Ô Này' Chủ Động Trong Modal Chi Tiết**:
                 - Khi mở xem lịch sử chỉnh sửa ô (chuột phải hoặc bấm vào ô), xuất hiện nút **`🗑️ Xóa Lịch Sử Ô Này`** để bạn chủ động xóa lịch sử riêng của ô đó bất cứ lúc nào.
              3. 📊 **Cột 'Trạng Thái Sàn' (Marketplace Status)**:
                 - Cột dữ liệu riêng biệt hiển thị trạng thái từ Shopee/TikTok (Chờ xác nhận, Đã hoàn tiền, Giao hàng hoàn trả thành công, Đang chuyển hoàn...) với huy hiệu màu sắc trực quan, tự động cập nhật khi nạp file gối đầu.
              4. 🔔 **Trung Tâm Thông Báo & Lịch Sử Cập Nhật Đơn Hàng**:
                 - Nút chuông thông báo nổi bật kèm ô tìm kiếm siêu tốc theo Mã đơn / MVĐ và nút `🎯 Định Vị Đơn` 1-Click tự động nhảy Tab tuần và nháy xanh đơn hàng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
