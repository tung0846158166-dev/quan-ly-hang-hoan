name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.4
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.4
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.4 (Phân Loại 2 Sàn Shopee / TikTok Riêng Biệt & Nạp Chuẩn 100% Cả 5 Loại File Sàn)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.4

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.4`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.4.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.4**:
              1. 🛍️ **Tách biệt hoàn toàn 2 sàn `🟠 SÀN SHOPEE` và `⚫ SÀN TIKTOK SHOP`**:
                 - Bổ sung **Thanh Phân Loại Sàn 1-Click** ngay trên đầu bảng và trên **Bảng Tổng Kết Tồn Kho 300+ Phân Loại** ở dưới (`🌐 Gộp Cả 2 Sàn`, `🟠 RIÊNG SÀN SHOPEE`, `⚫ RIÊNG SÀN TIKTOK SHOP`) kèm bộ đếm số đơn và số lượng SP trực tiếp.
                 - Khi bấm chọn `🟠 RIÊNG SÀN SHOPEE` hoặc `⚫ RIÊNG SÀN TIKTOK SHOP`, toàn bộ **Bảng đơn hàng**, **4 thẻ KPI**, **5 tab trạng thái** và **Bảng tổng kết sản phẩm - màu sắc - size** đều lọc và tính toán độc lập cho riêng sàn đó.
              2. 📥 **Tương thích 100% với cả 3 mẫu file xuất Shopee Seller Center (`Đơn Đã Hủy`, `Giao Hàng Thất Bại`, `Trả Hàng / Hoàn Tiền`) & 2 mẫu file Salework / TikTok Shop**:
                 - **Nhận diện song song 2 mã vận đơn (`Mã vận đơn trả hàng` & `Mã vận đơn giao hàng`)**: Trong file Trả hàng/Hoàn tiền Shopee có cả 2 cột mã vận đơn chiều đi và chiều về, hệ thống tự động lưu cả 2 mã để khi kho quét bất kỳ mã nào trên bọc hàng cũng khớp đơn ngay lập tức.
                 - **Xử lý chuẩn xác cột giá tiền có số thập phân `.00` của Shopee (VD: `138580.00`, `348840.00`)**: Không bị nhân 100 lần do dấu chấm thập phân; tự động dự phòng sang `Tổng Giá Trị` / `Đơn Giá` khi cột `Tổng số tiền Hoàn trả = 0`.
                 - **Bộ lọc thông minh cho đơn Trả hàng/Hoàn tiền Shopee**: Tự động bỏ qua các dòng *"Yêu cầu của Người mua đã hủy"* (khách hủy khiếu nại, giữ lại hàng không trả nữa) và giữ lại đầy đủ các đơn có trạng thái *"Hoàn thành"* nhưng phát sinh *"Đã Chấp Thuận Yêu Cầu"* trả hàng/hoàn tiền.
                 - **Nhận diện đầy đủ các mã vận đơn đặc thù mới của Shopee**: `SHOPEEVTPVN...` (Viettel Post), `GY...` (GHN 8 ký tự), `VN26...` (SPX Trong Ngày), và tách sạch các hậu tố `- Thêu Cao Cấp`, `- NỈ LÔNG CÁO`, `- Len Dệt Kim`, `(Pre Cao Cấp)`.
              3. 💾 **Giữ nguyên 100% dữ liệu cũ**: Cài đè trực tiếp lên bản đang dùng, toàn bộ đơn hàng và hình ảnh trong `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json` được giữ nguyên vẹn.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
