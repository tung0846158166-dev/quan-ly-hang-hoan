name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.5.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.5.2 (Hiển Thị Đầy Đủ Giờ Phút Từng Cột Theo File Nạp, Bộ Lọc Nhanh Ngày & Giờ Đa Năng Kết Hợp Hoặc Độc Lập)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.5.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.5.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.5.2.exe`)
            - **Các cải tiến & tính năng đột phá mới nhất trong phiên bản v1.5.2**:
              1. ⏱️ **Hiển Thị Đầy Đủ Ngày Và Giờ Phút Theo File Nhập Cho Từng Cột**:
                 - Nâng cấp bộ giải mã ngày giờ từ file Excel (Shopee, TikTok Shop, Salework): Giữ lại trọn vẹn cả Ngày và Giờ:phút:giây (`DD/MM/YYYY HH:mm:ss`).
                 - Cả 3 cột thời gian trọng yếu: `Ngày Gửi Đi`, `Ngày Hoàn / Hủy`, và `Ngày & Giờ Về Kho` đều hiển thị đầy đủ, sắc nét, không còn bị cắt cụt mất phần giờ phút.
                 - Tự động mở rộng độ rộng cột vừa vặn và hỗ trợ gõ chỉnh sửa nhanh (`DD/MM/YYYY HH:mm`).
              2. 🔍 **Bộ Lọc Nhanh Ngày & Giờ Đa Năng (Từ Ngày - Đến Ngày, Từ Giờ - Đến Giờ)**:
                 - Lọc linh hoạt theo 2 chế độ:
                   * **Kết hợp cùng ngày**: Chọn Từ ngày X đến ngày Y và Từ giờ A đến giờ B (ví dụ: ngày 05/11 đến 06/11 trong khung giờ 06:00 - 18:00).
                   * **Lọc giờ độc lập**: Bỏ trống ô ngày, chỉ chọn Từ giờ A đến giờ B để lọc các đơn phát sinh trong khung giờ đó trên toàn bộ mọi ngày (ví dụ: lọc ca sáng 06h - 18h).
                 - Tùy chọn mốc thời gian lọc: Ngày hoàn/hủy (mặc định), Ngày về kho, Ngày gửi đi, hoặc Mọi mốc.
                 - Các phím tắt nhanh preset: Hôm nay, Hôm qua, 7 ngày, Ca Sáng (06h - 18h), Ca Tối (18h - 06h). Nút `✕` xóa lọc tiện lợi.
              3. 🧹 **Làm Sạch 100% Lịch Sử Chỉnh Sửa Ô Khi Reset Đơn**:
                 - Đã xử lý triệt để việc xóa sạch lịch sử ô cũ khi bấm "🗑️ Xóa Hết Đơn Hiện Tại", kèm nút "Xóa Lịch Sử Ô Này" chủ động.
              4. 📊 **Cột Trạng Thái Sàn & Trung Tâm Thông Báo Đơn Hàng**:
                 - Đầy đủ tính năng v1.5.0: cột Trạng Thái Sàn, Trung tâm thông báo có ô tìm kiếm theo Mã đơn/MVĐ, và nút `🎯 Định Vị Đơn` 1-Click.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
