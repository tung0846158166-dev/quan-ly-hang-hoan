name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.7
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.7
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.7 (Thêm Cột Loại Đơn Phân Biệt Nguồn Phát Sinh, Cột Đã Nhận Thực Tế Theo Dõi Quét Kho, Giữ Trạng Thái Gốc THẤT THU Cho TikTok/Salework)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.7

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.7`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.7.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.7**:
              1. 📂 **Thêm cột `"Loại Đơn"` phân biệt rõ nguồn phát sinh của từng đơn hàng**:
                 - **`🚚 Giao không thành công`**: Đơn giao thất bại, cần theo dõi hàng quay về kho (tự động nhận diện từ file `Order.failed_delivery...` hoặc lý do hủy giao thất bại).
                 - **`↩️ Trả hàng/Hoàn tiền`**: Đơn có yêu cầu trả hàng hoặc hoàn tiền (tự động nhận diện từ file `Order.return_refund...` hoặc có trạng thái/phương án trả hàng hoàn tiền).
                 - **`🚫 Đơn hủy`**: Đơn bị hủy (tự động nhận diện từ file `Order.cancelled...` hoặc đơn trạng thái `HỦY`).
                 - **`⚫ THẤT THU (Salework)`**: Giữ nguyên trạng thái gốc **`THẤT THU`** đối với file TikTok xuất qua Salework (vì chỉ dựa vào chữ `THẤT THU` của Salework chưa đủ để tự kết luận đơn thuộc nhóm nào), đồng thời cho phép bấm chọn đổi nhóm ngay trên dòng bất cứ lúc nào.
              2. 🟢 **Cột `"Đã Nhận Thực Tế"` theo dõi độc lập bằng kết quả quét kho**:
                 - Khi mới nạp đơn (`Giao không thành công`, `Trả hàng/Hoàn tiền`, `THẤT THU`, `Đơn hủy`), cột **`Đã Nhận Thực Tế`** mặc định ở trạng thái **`🟡 Chưa nhận (Chờ về)`**.
                 - Ngay khi bạn quét mã vạch kiện hàng về kho, cột **`Đã Nhận Thực Tế`** tự động chuyển sang **`🟢 Đã nhận (Về kho)`** kèm ngày giờ thực tế, trong khi cột **`Loại Đơn`** vẫn giữ nguyên 100% nguồn phát sinh ban đầu.
              3. 🔍 **Thêm bộ lọc nhanh theo `Loại Đơn` trên thanh công cụ**:
                 - Lọc riêng từng nhóm `Giao không thành công`, `Trả hàng/Hoàn tiền`, `Đơn hủy`, hoặc `THẤT THU (Gốc Salework)` chỉ với 1 cú nhấp chuột.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
