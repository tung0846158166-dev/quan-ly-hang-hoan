name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bất kỳ lúc nào trên web GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Executable (.exe)
        run: npm run build:win

      - name: Upload Artifacts (.exe & portable)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-App
          path: |
            dist/*.exe
            dist/*.zip

      - name: Create GitHub Release (khi gắn tag phiên bản)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
