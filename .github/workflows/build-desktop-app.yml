name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.1
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.1 (Sửa Lỗi Đơ Con Trỏ Nhập Liệu & Bộ Lọc Bảng Tổng Kết)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.1

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.1`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.1.exe`)
            - **Điểm nâng cấp & sửa lỗi trong v1.2.1**:
              1. ⌨️ **Khắc phục triệt để 100% lỗi nhấp con trỏ vào ô nhập văn bản bị đơ / khóa bàn phím trên Windows**:
                 - Thay thế toàn bộ hộp thoại `window.alert` và `window.confirm` mặc định của Windows bằng **Hộp thoại In-App thông minh** (tránh lỗi hệ điều hành Windows khóa focus bàn phím sau khi đóng thông báo Mở khóa / Xóa đơn / Nhập Excel).
                 - Tự động kích hoạt `webContents.focus()` và giữ nguyên con trỏ trong ô đang gõ, không bao giờ làm mất con trỏ khi đang nhập liệu.
              2. 🔍 **Khắc phục hoàn toàn Bộ Lọc Bảng Tổng Kết 300+ Phân Loại bên dưới**:
                 - Hoạt động nhạy bén tức thì khi gõ lọc **Tên sản phẩm**, **Màu sắc**, **Size** (hỗ trợ tìm cả có dấu lẫn không dấu, ví dụ gõ `quan` hoặc `quần` đều ra `Quần jeans`, `Quần kaki`) và lọc theo trạng thái (`Đã có hàng về`, `Có chênh lệch`, `Đang chờ về`, `Bị mất`).
                 - Hiển thị chính xác bộ đếm `Hiển thị X / Y phân loại` và nút `✕ Xóa bộ lọc`.
                 - Chống giật lag khi gõ vào **Ô Tìm Kiếm Nhanh** và khi gõ sửa thông tin từng ô.
              4. 📸 **Sửa triệt để lỗi Quét Mã Điện Thoại Tự Chụp Đơn "Cái Được Cái Không"**:
                 - Tự động chia nhỏ ảnh chụp thành các gói `< 2.5KB` khi truyền qua `ntfy.sh` kết hợp `MQTT`, vượt qua giới hạn `4KB` của máy chủ để **100% lần quét đều nhận đủ cả mã vạch lẫn ảnh chụp kiện hàng**.
                 - Xử lý thông minh khi gói ảnh đến sau gói mã vạch 50–300ms (không bị bộ chống trùng 2 giây chặn nhầm).
                 - Lưu thẳng hình ảnh chụp vào file dữ liệu trên ổ cứng máy tính (`Documents\QuanLyHangHoan\du_lieu_hang_hoan.json`).
              5. 💾 **Giữ nguyên 100% dữ liệu cũ**: Cài đè trực tiếp lên bản cũ, toàn bộ 511+ đơn hàng trên ổ cứng được giữ nguyên vẹn.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
