name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master, fix/audit-17-regressions, fix/return-parcels-sync ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Acquire production SheetJS engine for real workbook tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $enginePath = Join-Path $env:RUNNER_TEMP 'sheetjs-engine.cjs'
          Invoke-WebRequest -Uri 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js' -OutFile $enginePath
          node -e "const x=require(process.argv[1]); if(x.version!=='0.20.1') throw new Error('Unexpected SheetJS engine version: '+x.version); console.log('SheetJS '+x.version);" $enginePath

      - name: Test storage, phone, Excel and UI regressions
        run: npm test
        env:
          XLSX_ENGINE_PATH: ${{ runner.temp }}/sheetjs-engine.cjs

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.11
          path: |
            dist/*.exe
            dist/*.blockmap
            mobile_scanner.html
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.11
          name: "Quản Lý Hàng Hoàn v1.8.11 — Sửa nhập Excel và kiện hoàn"
          body: |
            ### Bản sửa 1.8.11

            - Mobile mặc định quét hoàn kho, tách hàng đợi tạo mới/đối soát và trả đúng cảnh báo trùng.
            - Sửa bộ lọc số lượng hoàn 0 trong file Shopee Order.cancelled/Order.failed_delivery.
            - Sửa nhận diện cột, số lượng hoàn, đơn giá/tổng tiền, trạng thái và mã hoàn bổ sung.
            - Chọn đúng sheet, nhập nhiều schema riêng, loại chồng lặp giữa file.
            - Nhập bổ sung SKU hoặc thay snapshot rõ ràng; báo kết quả sau lưu, rollback khi lỗi.
            - Bao gồm sửa kiện hoàn và đồng bộ điện thoại của 1.8.8; cần cập nhật cả PC/mobile.
            - Kiểm thử thực tế Windows/iPhone/4G cần nghiệm thu riêng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
