name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.5
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.5
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.5 (Khôi Phục Dữ Liệu = Xóa Sạch Toàn Bộ Đơn Hiện Tại Về 0 Đơn & Phân Loại 2 Sàn Shopee / TikTok)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.5

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.5`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.5.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.5**:
              1. 🗑️ **Nâng cấp mục `Khôi Phục Dữ Liệu` = Xóa Sạch Toàn Bộ Đơn Hiện Tại (Về `0 đơn`)**:
                 - Tại menu `⚙️ Quản Lý & Bảo Mật ➔ 🗑️ Khôi Phục Dữ Liệu (Xóa Hết Đơn Hiện Tại)` và nút `🗑️ Xóa Hết Đơn Hiện Tại` trong cửa sổ `📥 Nạp File Shopee / TikTok`, khi xác nhận bằng mật khẩu Chủ Shop (`123456`), hệ thống sẽ **xóa sạch 100% đơn hàng hiện tại trên bảng chính, bảng thống kê kho và bộ nhớ tra cứu về `0 đơn`** (thay vì nạp lại các đơn mẫu thử nghiệm như trước).
                 - Đồng bộ ngay trạng thái bảng trống (`0 đơn`) vào file ổ cứng `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json`, đảm bảo khi tắt đi bật lại bảng vẫn giữ nguyên trạng thái sạch sẽ để bạn nạp file thật từ sàn vào.
              2. 🛍️ **Tách biệt hoàn toàn 2 sàn `🟠 SÀN SHOPEE` và `⚫ SÀN TIKTOK SHOP`**:
                 - Thanh chuyển sàn 1-Click ngay trên đầu bảng và trên **Bảng Tổng Kết Tồn Kho 300+ Phân Loại** (`🌐 Gộp Cả 2 Sàn`, `🟠 RIÊNG SÀN SHOPEE`, `⚫ RIÊNG SÀN TIKTOK SHOP`) kèm bộ đếm số đơn và số lượng SP trực tiếp.
              3. 📥 **Tương thích 100% với cả 3 mẫu file xuất Shopee Seller Center (`Đơn Đã Hủy`, `Giao Hàng Thất Bại`, `Trả Hàng / Hoàn Tiền`) & 2 mẫu file Salework / TikTok Shop**.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
