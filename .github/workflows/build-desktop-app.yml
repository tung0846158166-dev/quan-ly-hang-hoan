name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.4
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.4
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.4 (Hồ Sơ Khiếu Nại Sàn 1-Click, Phân Tích Top SP Hoàn, Đếm Ngược Hạn Xử Lý & Âm Thanh Báo Quét)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.4

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.4`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.4.exe`)
            - **Các tính năng đột phá mới trong phiên bản v1.3.4**:
              1. 🛡️ **Tạo Hồ Sơ Khiếu Nại Sàn 1-Click (Gửi Bằng Chứng Shopee/TikTok Đòi Bồi Thường 100%)**:
                 - Bấm 1 nút ngay trong chi tiết đơn hàng: tự động gom Mã khiếu nại, Mã đơn, MVĐ hoàn/giao, Tên & Size SP, Lý do hư hỏng/tráo hàng, kèm ảnh chụp bóc kiện thực tế tại kho.
                 - Tạo sẵn văn bản khiếu nại chuẩn form để shop sao chép và dán ngay vào Seller Center.
              2. ⏳ **Đồng Hồ Đếm Ngược Hạn Phản Hồi Khiếu Nại (Countdown & Cảnh Báo Gấp)**:
                 - Cột Hạn Cần Xử Lý hiển thị thời gian còn lại: `🚨 Quá hạn X ngày`, `⏳ Hết hạn hôm nay!`, `⚠️ Còn 1 ngày`, `⏰ Còn X ngày` giúp shop không bao giờ bị mất tiền oan do quá hạn phản hồi.
              3. 🔊 **Âm Thanh Phân Loại Quét Mã Vạch Chuẩn POS (Web Audio API Offline)**:
                 - Bíp ngân kép vui tai khi khớp đơn thành công (Xanh).
                 - 3 tiếng tít tít tít cảnh báo khi quét trùng kiện đã trả (Vàng).
                 - Âm tò te cảnh báo khi quét mã lạ không có trên hệ thống (Đỏ).
              4. 📦 **Quản Lý Ca Quét Nhận Hàng & Xuất Biên Bản Giao Nhận Shipper**:
                 - Tự động tích lũy số kiện đã nhận trong ca làm việc trên thanh tiêu đề.
                 - Xuất biên bản giao nhận 1 chạm kèm danh sách mã vận đơn để ký chốt với shipper giao hàng hoàn.
              5. 📊 **Bảng Phân Tích & Đối Soát Tài Chính Nâng Cao (Analytics Dashboard)**:
                 - Thống kê Top 10 mẫu áo bị hoàn nhiều nhất (Áo polo, sweater len, cardigan...).
                 - Phân tích Top lý do khách hoàn hàng phổ biến nhất để shop tối ưu tư vấn size và chất lượng.
                 - Đối soát chi phí vận chuyển 2 chiều (phí ship giao, phí ship hoàn, tiền bồi hoàn sàn).
              6. 🖨️ **In Tem Kiểm Kho Re-Stock (Decal 50x30mm hoặc K80)**:
                 - In nhanh nhãn tem kiểm định chất lượng để dán lên bọc kiện sẵn sàng đưa lại lên kệ bán tiếp.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
