name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.7.9
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.9
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.7.9 (Nhận Diện Thông Minh Đơn Hoàn 1 Phần)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.7.9

- **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.9`)
- **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.9.exe`)
- **Các cải tiến mới nhất trong phiên bản v1.7.9**:
  1. ⚡ **Nhận diện chính xác 100% Đơn Hoàn 1 Phần (Khách mua 2 SP nhưng chỉ hoàn 1 SP)**:
     - Tự động nhận diện từ cột `Trả hàng/Hoàn tiền toàn bộ Đơn Hàng? : Một phần đơn hàng` của Shopee và `Return Quantity` của TikTok Shop.
     - Sửa triệt để lỗi ghi đè số lượng: Ưu tiên tuyệt đối Số lượng Hoàn (`Return Quantity`), không bị nhầm lẫn với số lượng mua ban đầu.
  2. 🏷️ **Huy hiệu trực quan `⚡ Hoàn 1 phần` nổi bật**:
     - Hiển thị badge màu cam nổi bật ngay tại cột *Sản phẩm* và cột *Loại đơn* kèm số lượng hoàn thực tế (`x1 (1 phần)`).
     - Giúp nhân viên kho khui hàng biết ngay khách chỉ trả 1 món, không tìm kiếm món thứ 2 và không khiếu nại nhầm!
  3. 🔍 **Bộ lọc & Tìm kiếm Đơn Hoàn 1 Phần**:
     - Thêm mục `⚡ Hoàn 1 phần đơn hàng` vào dropdown *Loại đơn*.
     - Hỗ trợ gõ tìm kiếm "hoàn 1 phần" hoặc "một phần" trên thanh tìm kiếm.
  4. 📊 **Bảng đối soát chi tiết tài chính**:
     - Hiển thị rõ *Phạm vi hoàn hàng*, *Tiền hoàn trả món này* và *Tổng giá trị cả đơn mua ban đầu*.

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.9`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.6.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.7.9**:
              1. 🎯 **Chuẩn hóa 100% Trạng thái sàn & Loại đơn cho Sàn Shopee & TikTok**:
                 - Sửa triệt để tình trạng hiển thị `Chờ sàn cập nhật` trên các đơn Shopee. Tự động trích xuất chính xác trạng thái từ cột `Trạng thái Trả hàng/Hoàn tiền` ("Chờ bạn xác nhận hàng trả về", "Đã hoàn tiền cho Người mua"...) và `Trạng thái đơn hàng` ("Đã hủy").
                 - Đảm bảo 100% đơn Shopee và TikTok không còn bị gán nhầm thành `THẤT THU` hay `Chờ sàn cập nhật`.
              2. 📅 **Tự động điền 100% Ngày Gửi Đi (Ship Date) cho cả Shopee & TikTok Shop**:
                 - Thuật toán phục hồi ngày gửi đi đa tầng: Tuyệt đối không còn hiển thị placeholder `DD/MM/YYYY HH:mm`.
              3. 📱 **Mục [Tạo Đơn Mới] trên điện thoại (`mobile_scanner.html`)**:
                 - Nút chuyển chế độ `[🔍 Hàng hoàn]` và `[✨ Tạo đơn mới]`, chọn sàn Shopee/TikTok và ghi chú.
              4. 💻 **Hộp [BẢNG ĐƠN MỚI] chuyên dụng trên máy tính**:
                 - Checkbox chọn từng đơn hoặc chọn tất cả.
                 - Các nút `[📥 Nhập ra ngoài]` và `[🗑️ Xóa]` linh hoạt theo đúng yêu cầu.
              4. 🏷️ **Sửa lỗi hiển thị Loại đơn & Trạng thái sàn TikTok Shop**:
                 - Hiển thị chuẩn xác `Trả hàng/Hoàn tiền` hoặc `Giao không thành công` (đơn bom), không còn bị nhầm lẫn thành `THẤT THU` hoặc `Chờ sàn cập nhật`.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
