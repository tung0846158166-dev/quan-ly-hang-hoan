name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.6.6
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.6
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.6.6 (Thêm Cột Ghi Chú Của Tôi & Ghi Chú Lý Do Theo Dõi Đơn)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.6.6

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.6.6`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.6.6.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.6.6**:
              1. 📝 **Bổ sung cột "Ghi Chú Của Tôi" trên Bảng Chính**:
                 - Cho phép người dùng ghi chú nội bộ riêng cho từng đơn hàng (bấm 1 lần xem nhanh/copy, nhấp đúp để gõ chỉnh sửa trực tiếp, Enter hoặc click ngoài tự động lưu).
                 - Xuất khẩu đầy đủ cột Ghi Chú Của Tôi sang các bảng báo cáo Excel.
              2. ⭐ **Thêm Ghi Chú / Lý Do Theo Dõi Khi Tích Chọn Theo Dõi**:
                 - Khi tích chọn theo dõi (hoặc bấm biểu tượng ngôi sao), hệ thống mở hộp thoại để nhập lý do theo dõi (ví dụ: Chờ bồi thường, Hàng dễ vỡ, Nghi ngờ tráo hàng...).
                 - Bấm lại vào ngôi sao để chỉnh sửa nhanh lý do theo dõi hoặc xóa trắng để gỡ khỏi danh sách theo dõi.
                 - Bảng Theo Dõi Đơn Hàng (Watchlist Modal) có thêm cột "Lý Do Theo Dõi" với nút chỉnh sửa nhanh ✏️.
                 - Tìm kiếm thông minh theo từ khóa trong Ghi Chú Của Tôi và Lý Do Theo Dõi.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
