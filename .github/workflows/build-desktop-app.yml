name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.0
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.0
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.0 (Xuất HTML Kiểm Hàng, Xuất Excel & Quét Mã Vạch Điện Thoại)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.0

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.0`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.0.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.8.0**:
              1. 🌐 **Xuất file HTML Kiểm Hàng Tương Tác**:
                 - Tích chọn đơn hàng trên bảng và bấm nút `[🌐 Xuất HTML Kiểm Hàng]`.
                 - Bảng HTML độc lập tinh gọn chỉ hiển thị: Mã đơn hàng, Mã vận đơn, Tên sản phẩm, Màu sắc, Size, Số lượng còn lại.
                 - Tích hợp ô tìm kiếm nhanh đa năng theo mọi trường thông tin.
                 - Ô tích kiểm hàng độc lập ở cuối mỗi hàng theo số lượng sản phẩm (ví dụ: SL 2 thì có 2 ô [SP 1], [SP 2]).
                 - Khi tích vào sẽ tự động trừ số lượng còn lại về 0 và chuyển trạng thái "Đã đủ (X/X)".
                 - **Bảo mật tuyệt đối với Mật khẩu 9999**: Ô đã tích muốn bỏ tích phải nhập đúng mật khẩu 9999 mới được hoàn lại số lượng; sửa thông tin các ô cũng bắt buộc nhập mật khẩu 9999.
              2. 📊 **Xuất Excel Đơn Đã Chọn**:
                 - Bấm nút `[📊 Xuất Excel Đơn Đã Chọn]` để xuất file Excel (.xlsx) độc lập cho các đơn được tích chọn, kèm đầy đủ 2 Sheet (Chi tiết từng đơn & Tổng kết số lượng SKU).
              3. 📱 **Nâng Cấp Quét Mã Vạch Điện Thoại Siêu Nhạy**:
                 - Tự động nhận diện thanh sọc mã vạch 1D Code 128 (SPX Express, J&T...) từ camera điện thoại cả chiều ngang lẫn dọc.
                 - Thu phóng tự động, khử mờ và xử lý tương phản cao giúp quét chính xác ngay cả với tem in mờ hoặc bóng lóa.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
