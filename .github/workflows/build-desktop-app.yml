name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.2 (Ghi Chú Người Mua, Click 1 Lần Xem Chi Tiết / 2 Lần Chỉnh Sửa, Bộ Lọc Đặt Trước & Khoảng Ngày & MVĐ)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.2.exe`)
            - **Các tính năng mới nổi bật trong phiên bản v1.3.2**:
              1. 📝 **Trích Xuất Chuẩn Xác Cột Ghi Chú Người Mua Đa Nguồn**:
                 - Tự động nhận diện và trích xuất ghi chú từ mọi định dạng file: Shopee Trả hàng (`Ghi chú của Người mua khi trả hàng`), Shopee Đơn hủy (`Nhận xét từ Người mua`), Salework / TikTok (`Ghi chú của khách`).
                 - Tách riêng thành một cột độc lập `"Ghi Chú Người Mua"`, không bị hòa lẫn vào lý do hoàn hoặc các cột số tiền/phí sàn.
              2. 🔍 **Tương Tác 2 Cấp Độ Cho Toàn Bộ Các Ô: Click 1 Lần Xem Chi Tiết — Click 2 Lần (Double Click) Chỉnh Sửa**:
                 - Click 1 lần: Mở khung nổi Popover hiển thị 100% nội dung đầy đủ không bị cắt ngắn (tên sản phẩm dài, mã đơn, ghi chú người mua, lý do...), kèm nút "📋 Sao chép" và nút "✏️ Sửa".
                 - Click 2 lần: Kích hoạt trực tiếp ô nhập liệu inline để sửa nội dung và lưu tức thì.
              3. ⭐ **Bộ Lọc Hàng Đặt Trước vs Đơn Thường**:
                 - Tùy chọn lọc: `⭐ Hàng đặt trước` (Pre-order) hoặc `⚡ Đơn thường`.
                 - Bảng chính và bảng tổng kết số liệu bên dưới tự động đồng bộ theo lựa chọn.
              4. 📆 **Bộ Lọc Khoảng Ngày Tùy Chọn Linh Hoạt (Từ Ngày ➔ Đến Ngày)**:
                 - Chọn mốc ngày cần lọc: `📥 Ngày về kho`, `↩️ Ngày hoàn/hủy`, `🚚 Ngày gửi đi` hoặc `📅 Mọi mốc ngày`.
                 - Nhập khoảng ngày linh hoạt từ ngày đến ngày với nút xóa lọc nhanh `✕`.
              5. 🔖 **Bộ Lọc Đơn Có Mã Vận Đơn & Không Có Mã Vận Đơn**:
                 - `✅ Có mã vận đơn`: Đơn đã được bàn giao vận chuyển và có mã tracking.
                 - `❌ Không có MVĐ (Hủy trước gửi)`: Đơn khách hủy trước khi bàn giao vận chuyển.
              6. 📊 **Làm Rõ Số Đơn và Lượt Mặt Hàng Ở Bảng Tổng Kết (1052 đơn vs 1191 lượt SP)**:
                 - Hiển thị rõ: `1052 đơn (1191 lượt SP)` với tooltip giải thích cụ thể: 1052 mã đơn hàng duy nhất, 1191 lượt mặt hàng do có đơn đặt từ 2 sản phẩm trở lên. Cột Tổng SL hoàn ở cả 2 bảng khớp tuyệt đối `1254 SP`.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
