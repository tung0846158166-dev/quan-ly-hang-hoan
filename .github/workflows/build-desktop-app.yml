name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.1.1
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.1.1 (Sửa Lỗi Mở Khóa, Xóa Đơn & Khôi Phục Mẫu)"
          body: |
            ### 🎉 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.1.1

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok
            - **Định dạng**: Bộ cài đặt chuẩn Windows (.exe setup wizard)
            - **Điểm nâng cấp & sửa lỗi trong v1.1.1**:
              - 🔓 **Sửa lỗi không mở khóa được**: Thay thế toàn bộ hộp thoại `window.prompt()` mặc định bằng Hộp Thoại Nhập Mật Khẩu Chuyên Nghiệp in-app. Giờ đây khi bấm vào nút Khóa Chỉ Xem hoặc bất kỳ nút nào, hộp thoại sẽ hiện lên ngay lập tức, hỗ trợ phím Enter, phím Esc và nút Hiện/Ẩn mật khẩu (mắt xem mật khẩu).
              - 🔑 **Mật khẩu Chủ Shop mặc định**: `123456` (có thể đổi tùy ý trong menu Tiện ích).
              - 🗑️ **Sửa lỗi không bấm xóa được đơn hàng**: Giờ đây khi bảng đang khóa, bấm vào nút Xóa (thùng rác) ở cột Thao tác sẽ hiển thị ngay hộp thoại xác nhận nhập mật khẩu Chủ Shop để xóa đơn an toàn.
              - 🔄 **Sửa lỗi nút Khôi phục mẫu 5 đơn ban đầu**: Nút khôi phục mẫu luôn sẵn sàng trong menu Tiện ích, nhập mật khẩu `123456` là đưa bảng về trạng thái mẫu ban đầu ngay tức khắc.
              - 💾 **An toàn dữ liệu 100%**: Khi cài đè bản v1.1.1 lên v1.1.0, toàn bộ dữ liệu trên ổ cứng tại `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json` được giữ nguyên nguyên vẹn.
              - 🚀 **Đầy đủ tính năng chạy nền và khởi động cùng Windows**.

            **Hướng dẫn cài đặt**:
            1. Tải file `Quan.Ly.Hang.Hoan.Setup.1.1.1.exe` bên dưới.
            2. Mở file và bấm **Next** để cài đè trực tiếp lên phiên bản hiện có (không cần gỡ bản cũ).
            3. Mở phần mềm và tận hưởng sự mượt mà!
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
