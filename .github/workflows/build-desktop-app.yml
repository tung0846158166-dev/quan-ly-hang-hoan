name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.7.0
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.0
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.7.0 (Đột Phá Quét Mã Vạch 1D & QR Code Điện Thoại Siêu Nhạy)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.7.0

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.0`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.0.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.7.0**:
              1. 📱 **Nâng cấp toàn diện bộ quét Camera điện thoại - Quét được cả Mã Vạch (1D) lẫn Mã QR**:
                 - Tích hợp **Dual Scan Engine**: Chạy song song bộ giải mã phần cứng Native `BarcodeDetector` (quét trực tiếp toàn bộ luồng video độ phân giải cao mà không bị cắt mép) cùng bộ quét đa định dạng `Html5Qrcode`.
                 - Mở rộng toàn bộ định dạng mã vạch thông dụng: **Code 128 (SPX, TikTok, J&T), Code 39, Code 93, Codabar, EAN-13, EAN-8, ITF, UPC-A, UPC-E** và **QR Code**.
                 - Băng quét mở rộng tối đa 94% chiều ngang, chấm dứt triệt để tình trạng mã vạch dài bị cắt cụt 2 đầu.
                 - Tự động bật chế độ lấy nét liên tục (`continuous focus`) trên ống kính điện thoại.
                 - Khắc phục lỗi Watchdog Timer khiến mã vạch bị hủy đếm ngược khi rung tay nhẹ. Giữ yên 0.5 giây nhận diện tức thì và đồng bộ sang máy tính!
              2. 📊 **Hoàn thiện giao diện hàng Tổng Cộng và thanh Dock nổi tức thì ở đáy màn hình**.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
