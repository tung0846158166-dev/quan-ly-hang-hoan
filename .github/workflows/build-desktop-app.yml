name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.6.9
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.9
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.6.9 (Sửa Hoàn Toàn Hàng Tổng Cộng, Căn Chuẩn Cột & Thanh Thống Kê Nổi Bật)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.6.9

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.6.9`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.6.9.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.6.9**:
              1. 📊 **Sửa triệt để lỗi hiển thị hàng Tổng Cộng (tfoot)**:
                 - Căn chuẩn toàn bộ 23 cột của bảng: Cột 1 (Ký hiệu Σ) và Cột 2 (Tổng số đơn) được ghim cố định bên trái (sticky column).
                 - Tích hợp thanh tóm tắt chỉ số nổi bật (Tổng số đơn, Tổng SL sản phẩm, Tổng tiền hàng, Đã về kho, Chưa về kho, Không cần nhận) ngay trong tầm nhìn (từ cột 3 đến 15) giúp người dùng nhìn thấy số liệu tổng ngay lập tức mà không cần cuộn ngang 15 cột.
                 - Các cột Tổng SL, Tổng Tiền, Nhận Tại Kho căn thẳng hàng tuyệt đối với cột dữ liệu tương ứng ở bảng chính.
                 - Sửa xung đột CSS ép độ rộng 48px sai lệch vào ô tổng cộng.
              2. 📌 **Kích hoạt thanh Dock thống kê tức thì ở mép dưới màn hình (Sticky Bottom Dock)**:
                 - Tự động cập nhật số liệu thời gian thực theo bộ lọc và sàn TMĐT.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
