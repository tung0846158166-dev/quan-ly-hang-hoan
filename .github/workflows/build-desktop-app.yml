name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.6.4
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.4
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.6.4 (Tự Động Phục Hồi Ngày Gửi Đi, Fix Bảng Tổng Kết & Bảng Chờ Đồng Bộ ĐT)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.6.4

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.6.4`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.6.4.exe`)
            - **Các cải tiến & tính năng đột phá mới nhất trong phiên bản v1.6.4**:
              1. 📅 **Tự Động Phục Hồi Chuẩn Xác Cột "Ngày Gửi Đi"**:
                 - Tích hợp cơ chế phục hồi ngày gửi đi đa tầng thông minh: kiểm tra `shipDate` -> kiểm tra `rawDetails` / `orderDate` -> đối soát CSDL lịch sử đơn Shopee -> giải mã trực tiếp tiền tố ngày tháng `YYMMDD` từ Mã Đơn Hàng Shopee (100% không bao giờ bị ô trống).
                 - Tự động quét và phục hồi lại toàn bộ ngày gửi cho các đơn hàng cũ đã lưu trên ổ cứng ngay khi khởi động phần mềm.
              2. 📊 **Sửa Triệt Để Giao Diện Bảng Tổng Kết Thống Kê Phân Loại**:
                 - Loại bỏ hoàn toàn xung đột CSS sticky làm cột "Tên Sản Phẩm" bị ép co cụm 40px.
                 - Cột Tên Sản Phẩm hiển thị rộng rãi, rõ ràng, toàn bộ bảng mở rộng 100% toàn màn hình với nền trắng sang trọng, không còn dải màu đỏ trống bên phải.
              3. 📱 **Bảng Danh Sách Chờ Đồng Bộ Độc Lập Trên Điện Thoại (Quét Lúc Tắt Máy Tính)**:
                 - Bổ sung bảng chuyên biệt "BẢNG DANH SÁCH ĐƠN CHỜ ĐỒNG BỘ VỚI MÁY TÍNH" ngay trên giao diện quét mã điện thoại.
                 - Khi máy tính chưa bật, mọi kiện hàng quét và ảnh chụp được lưu trữ cục bộ an toàn, hiển thị rõ ràng mã vận đơn, giờ quét, biểu tượng ảnh và huy hiệu số lượng chờ nạp.
                 - Cho phép người dùng xóa từng đơn đã quét (`🗑️ Xóa`) hoặc xóa toàn bộ danh sách chờ bất kỳ lúc nào trước khi mở máy tính để đồng bộ.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
