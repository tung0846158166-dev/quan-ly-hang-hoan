name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.1.0
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.1.0 (Chạy Nền & Tự Khởi Động)"
          body: |
            ### 🎉 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.1.0

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok
            - **Định dạng**: Bộ cài đặt chuẩn Windows (.exe setup wizard)
            - **Tính năng mới trong v1.1.0**:
              - 🚀 **Tự khởi động cùng máy tính**: Khi bật máy tính, phần mềm tự động chạy ngầm sẵn sàng.
              - 🔄 **Chạy nền khay hệ thống (System Tray)**: Khi bấm nút dấu X, ứng dụng không bị tắt mà tự thu nhỏ xuống khay hệ thống góc phải màn hình.
              - 📱 **Quét điện thoại liên tục**: Bạn có thể đóng cửa sổ làm việc khác, cầm điện thoại đi quét mã đơn hoàn trong kho, bảng máy tính vẫn tự động nhận dữ liệu, cập nhật trạng thái và lưu thẳng vào ổ cứng.
              - 🔔 **Thông báo Windows Notification**: Mỗi khi điện thoại quét trúng đơn hoàn, góc phải màn hình máy tính sẽ hiện thông báo nổi chúc mừng.
              - 💾 **Lưu trữ ổ cứng vĩnh viễn**: Toàn bộ dữ liệu nằm an toàn tại `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json`.

            **Hướng dẫn cài đặt**:
            1. Tải file `Quan.Ly.Hang.Hoan.Setup.1.1.0.exe` bên dưới.
            2. Cài đè trực tiếp lên phiên bản cũ (toàn bộ dữ liệu cũ được giữ nguyên 100%).
            3. Trải nghiệm tính năng chạy nền và quét đơn từ điện thoại!
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
