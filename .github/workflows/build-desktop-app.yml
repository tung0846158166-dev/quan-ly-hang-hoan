name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.5
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.5
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.5 (Hàng Đợi Quét Ngoại Lệ & Đồng Bộ Ảnh Chụp 100% Khi Tắt Máy)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.5

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.5`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.5.exe`)
            - **Các tính năng đột phá mới trong phiên bản v1.3.5**:
              1. 📱 **Hàng Đợi Quét Ngoại Tuyến Trên Điện Thoại (Offline Queue & Photo Store)**:
                 - Khi máy tính chưa bật hoặc mất mạng, nhân viên kho vẫn cầm điện thoại quét mã vạch và chụp ảnh hàng hoàn bình thường.
                 - Toàn bộ mã vận đơn và 100% ảnh chụp bóc kiện được lưu an toàn tuyệt đối trong bộ nhớ điện thoại (LocalStorage/IndexedDB).
                 - Thẻ trạng thái thông minh hiển thị rõ: `🟡 Đang lưu tạm: X kiện (Y ảnh chụp) chờ máy tính mở`.
              2. 🔄 **Đồng Bộ Tự Động 1-Chạm Khi Bật Máy Tính (Auto-Sync & 1-Tap Sync)**:
                 - Ngay khi máy tính bật lên và mở phần mềm, máy tính tự động phát tín hiệu `pc_hello` qua MQTT/ntfy.
                 - Điện thoại nhận diện máy tính đã online (chuyển sang `🟢 Máy Tính Đang Mở`) và tự động đẩy toàn bộ danh sách kiện kèm ảnh chụp sang bảng máy tính trong tích tắc.
                 - Tích hợp thêm nút bấm chủ động: `🔄 ĐỒNG BỘ TOÀN BỘ MÃ & ẢNH SANG MÁY TÍNH (1-CHẠM)`.
              3. 📥 **Kéo Bù Dữ Liệu Đám Mây 12 Giờ (Cloud Catch-up Buffer 12H)**:
                 - Khi bật máy tính lên, phần mềm tự động quét bộ nhớ đệm đám mây ntfy.sh trong vòng 12 giờ qua để khôi phục toàn bộ các lượt quét và mảnh ảnh chụp phát sinh lúc máy tính tắt.
                 - Nút bấm `📥 Kéo Lại Mã & Ảnh Quét Lúc Tắt Máy` sẵn sàng trong cửa sổ quét mã để shop chủ động kéo lại dữ liệu bất cứ lúc nào.
              4. ⚡ **Đảm Bảo 100% Ảnh Chụp Không Bị Thất Lạc**:
                 - Tự động gắn ảnh chụp thực tế vào đúng dòng đơn hàng trên bảng, hiển thị thumbnail trực quan, lưu vào IndexedDB ổ cứng máy tính và hỗ trợ xuất hồ sơ khiếu nại sàn ngay lập tức.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
