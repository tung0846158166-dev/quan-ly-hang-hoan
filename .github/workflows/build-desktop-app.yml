name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.5.0
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.5.0 (Cột Trạng Thái Sàn, Trung Tâm Thông Báo & Tra Cứu Theo Mã Đơn/MVĐ, Định Vị Đơn 1-Click)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.5.0

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.5.0`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.5.0.exe`)
            - **Các tính năng mới nổi bật trong phiên bản v1.5.0**:
              1. 📊 **Bổ Sung Cột 'Trạng Thái Sàn' (Marketplace Status Column)**:
                 - Cột dữ liệu mới hiển thị trực quan trạng thái từ Shopee/TikTok (Chờ bạn xác nhận, Đã hoàn tiền cho Người mua, Giao hàng hoàn trả thành công, Đang chuyển hoàn, Đơn hủy...).
                 - Tự động nhận diện và gắn huy hiệu màu sắc thông minh (cảnh báo cam, thành công xanh...). Bấm đúp để chỉnh sửa nhanh.
                 - Khi nạp các file Excel gối đầu ngày, hệ thống tự động cập nhật trạng thái sàn mới nhất mà vẫn bảo lưu 100% tình trạng nhận hàng kho thực tế của bạn.
              2. 🔔 **Bảng Thông Báo & Lịch Sử Cập Nhật Đơn Hàng (Notification Center)**:
                 - Nút chuông thông báo nổi bật màu hổ phách trên thanh tiêu đề kèm huy hiệu đếm số thông báo mới.
                 - Tự động ghi nhận cả 2 nguồn thông tin quan trọng:
                   * Lượt quét đơn từ xa bằng điện thoại: Khớp đơn, cảnh báo quét trùng lặp, mã lạ chưa có trên hệ thống.
                   * Lượt nạp file Excel: Ghi rõ danh sách các đơn trùng lặp vừa được cập nhật trạng thái sàn hoặc bổ sung mã vận đơn hoàn mới.
              3. 🔍 **Ô Tìm Kiếm Nhanh Bên Trong Bảng Thông Báo**:
                 - Nhập Mã đơn hàng hoặc Mã vận đơn (MVĐ) để xem ngay lịch sử cập nhật của đơn cần xem siêu tốc.
                 - Hỗ trợ các tab phân loại: Tất Cả, 📱 Quét ĐT, 🔄 Cập Nhật Excel, ⚠️ Trùng & Cảnh Báo.
              4. 🎯 **Nút '🎯 Định Vị Đơn' 1-Click**:
                 - Bấm trực tiếp trên từng mục thông báo để đóng modal, tự động chuyển sang đúng Tab tuần của đơn đó và kích hoạt hiệu ứng nháy xanh nổi bật định vị đơn hàng trên bảng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
