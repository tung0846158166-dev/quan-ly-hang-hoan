name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.6.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.6.2 (Tối Ưu Tinh Gọn Giao Diện 4 Tầng, Sắp Xếp Hạn Cần Xử Lý Thông Minh, Tự Bỏ Chọn Sau Theo Dõi & Dọn Đơn Đã Về)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.6.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.6.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.6.1.exe`)
            - **Các cải tiến & tính năng đột phá mới nhất trong phiên bản v1.6.2**:
              1. 🎨 **Tối Ưu Tinh Gọn Giao Diện 4 Tầng Chuẩn Mực**:
                 - Tối ưu gom 7 thanh xếp chồng cồng kềnh trước đây xuống còn **4 tầng điều khiển cực kỳ thông thoáng, đẳng cấp**, giải phóng thêm 50% diện tích để hiển thị bảng đơn hàng.
                 - Tầng 1 (Top Bar đỏ): Gom logo, phiên bản v1.6.2, 1 badge lưu an toàn duy nhất và nhóm nút thao tác chính trên 1 hàng thẳng tắp.
                 - Tầng 2 (Điều hướng tổng): Gộp Tuần nạp, Sàn TMĐT (segmented buttons phẳng hiện đại), Chế độ xem bảng (chuyển lên đây loại bỏ hẳn hàng đen cũ), Phân tích & Ca nhận.
                 - Tầng 3 (Tìm kiếm & Pipeline): Ô tìm nhanh viền cam nổi bật + 7 Tab Pipeline trạng thái có màu sắc tương phản cao + Nút Xuất Đơn Đã Về.
                 - Tầng 4 (Bộ lọc chi tiết & Phân trang): Loại đơn, Trước/Thường, MVĐ, Sắp xếp ngày & hạn xử lý, Lọc ngày giờ đa năng thu gọn và thanh phân trang.
              2. 🚨 **Sắp Xếp Cột Hạn Cần Xử Lý Thông Minh**:
                 - Sắp xếp ưu tiên độ khẩn cấp: Báo Đỏ (+3 ngày) ➔ Báo Vàng (2 ngày) ➔ Trong hạn ➔ Đã nhận / K.cần nhận.
                 - Đơn có số giờ trôi qua nhiều nhất luôn được nổi lên trên đầu khi chọn sắp xếp giảm dần.
              3. 🛡️ **Loại Bỏ Lỗi Báo Đỏ Oan Cho Đơn Mới Gửi**:
                 - Chỉ tính hạn hủy khi đơn hàng thực sự có Ngày Hủy/Hoàn. Không còn fallback sang Ngày Gửi Đi để báo quá hạn oan.
              4. 🔒 **Tự Động Bỏ Chọn Sau Khi Thêm Vào Theo Dõi**:
                 - Sau khi bấm "⭐ Thêm Vào Theo Dõi", hệ thống tự động bỏ chọn toàn bộ checkbox và ẩn thanh công cụ nổi, ngăn chặn hoàn toàn nguy cơ bấm nhầm nút Xóa Các Đơn Đã Chọn.
              5. 📅 **Tự Động Xóa Lựa Chọn Khi Chuyển Tab Tuần / Đổi Sàn**:
                 - Chống lưu vết selection ngầm giữa các tuần nạp khác nhau, bảo vệ an toàn dữ liệu tuyệt đối.
              6. 📌 **Cố Định Vị Trí Cột Sticky (Checkbox & STT)**:
                 - Cột Checkbox và cột STT luôn được ghim cố định ở mép trái màn hình khi cuộn ngang 22 cột, giúp tích chọn cực nhanh.
              7. ✨ **Nút "Dọn Đơn Đã Về Kho" Trong Bảng Theo Dõi**:
                 - 1-Click tự động gỡ theo dõi toàn bộ các đơn đã quét nhận về kho an toàn, giữ lại các đơn chưa nhận hoặc quá hạn.
              8. 💡 **Điều Hướng Thông Minh Khi Chọn Tab Tuần 0 Đơn**:
                 - Hiển thị nút bấm gợi ý nhảy nhanh sang tuần có dữ liệu hoặc Xem Tất Cả Các Tuần.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
