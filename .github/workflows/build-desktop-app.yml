name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master, fix/audit-17-regressions ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Test storage, phone, Excel and UI regressions
        run: npm test

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.7
          path: |
            dist/*.exe
            dist/*.blockmap
            mobile_scanner.html
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.7
          name: "Quản Lý Hàng Hoàn v1.8.7 — Sửa lưu dữ liệu, ACK, ảnh và nhập TikTok"
          body: |
            ### Bản sửa lỗi v1.8.7

            - Chờ ghi dữ liệu trước khi xác nhận; xử lý lỗi kho lưu trữ và phục hồi backup cũ.
            - Giữ hàng đợi đến ACK khớp request; ảnh cần xác nhận lưu riêng; gửi lại không ghi trùng trong phiên PC.
            - Liên kết ảnh/OCR theo ID ổn định, bảo vệ xóa ảnh khi khóa, render thông báo bằng văn bản an toàn.
            - Sửa nhập TikTok: trạng thái trống, tiền nhiều SKU, size-only và Cancelled/Canceled.
            - Cần cập nhật cả ứng dụng PC và mobile_scanner.html trên trang HTTPS đang dùng.
            - Kiểm thử Windows/iPhone/4G thực tế cần nghiệm thu riêng; kết quả build không thay thế kiểm thử thiết bị.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
