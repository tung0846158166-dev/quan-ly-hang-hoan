name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.3
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.3
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.3 (Gom Nhóm SP Khi Xuất HTML Kiểm Hàng & Bảo Mật Mật Khẩu)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.3

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.3`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.3.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.8.3**:
              1. 📋 **Tối Ưu Bảng HTML Xuất Kiểm Hàng Tương Tác**:
                 - **Tự động gom nhóm sản phẩm**: Tất cả các sản phẩm có cùng Tên sản phẩm, Màu sắc và Size sẽ được tự động gom vào 1 dòng duy nhất và cộng dồn số lượng. (Lưu ý: Chỉ gom nhóm khi cả 3 yếu tố Tên, Màu, Size đều giống nhau 100%, khác size hoặc màu sẽ tách riêng).
                 - **Lược bỏ cột mã**: Bỏ cột Mã đơn hàng và Mã vận đơn để bảng hiển thị rộng rãi, tập trung trực quan vào: Tên sản phẩm, Màu sắc, Size, Số lượng, Ô tích trừ và Trạng thái.
                 - **Bảo mật tuyệt đối**: Đã ẩn hoàn toàn dòng chữ hiển thị mật khẩu `9999` trên giao diện, badge và các thông báo, tránh việc nhân viên nhìn thấy mật khẩu quản lý. Mật khẩu vẫn được bảo vệ ngầm khi sửa/bỏ tích.
              2. 🛡️ **Chống Trùng Đơn Khi Tạo Nhanh Hàng Loạt**:
                 - Tự động nhận diện và cảnh báo đơn đã có trên Bảng chính.
                 - Tự động bỏ tích các đơn trùng và bổ sung nút `[Lọc bỏ đơn trùng]`, `[Chỉ chọn đơn mới]`.
              3. ⚡ **Bảng Tạo Đơn Nhanh ([⚡ TẠO ĐƠN NHANH])**:
                 - Dán danh sách mã hàng loạt, lọc ký tự thừa, phân loại sàn TMĐT và trạng thái chờ về chuẩn xác.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
