name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.6
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.6
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.6 (Tách Riêng Cơ Chế Nạp Đơn Shopee & TikTok, Giữ Nguyên Chữ Premium Cao Cấp, Chuẩn Hóa Mã Vận Đơn & Giá Trị Hàng Hóa)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.6

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.6`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.6.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.6**:
              1. 🛍️ **Tách riêng hoàn toàn cơ chế nhập dữ liệu của 2 sàn (`🟠 Nạp Đơn Shopee` & `⚫ Nạp Đơn TikTok / Salework`)**:
                 - Thêm 2 nút nạp riêng biệt ngay trên thanh công cụ chính (`📥 Nạp Đơn Shopee` và `📥 Nạp Đơn TikTok`), trong menu `📂 Nhập / Xuất Dữ Liệu`, và 2 tab cơ chế riêng biệt trong cửa sổ nạp đơn.
              2. 🏷️ **Giữ nguyên 100% chữ `Premium Cao Cấp` trong Tên sản phẩm của đơn TikTok / Salework**:
                 - Tách sạch `Màu sắc` (VD: `Nâu`, `Xanh Than Mori`) và `Size` (VD: `XL`, `L`) sang đúng cột riêng nhưng **giữ nguyên hậu tố `- Premium Cao Cấp`** ở cuối Tên sản phẩm để phân biệt rõ ràng dòng thường và dòng `Premium Cao Cấp` trên cả bảng đơn hàng lẫn bảng tổng kết tồn kho bên dưới.
              3. 💰 **Chuẩn hóa Giá Trị Hàng Hóa TikTok & Cho phép đổi cột giá tức thì**:
                 - Mặc định lấy chuẩn cột **`[Z] Tổng giá trị / [K] Giá sàn TMĐT`** và tích hợp thanh chọn nhanh **4 cột giá TikTok / Salework** (`Cột [Z] Tổng giá trị`, `Cột [AM] Tổng tiền hàng sau chiết khấu`, `Cột [AO] Tổng tiền hàng / Giá gốc Salework`, `Cột [L] Doanh thu ước tính`). Khi đổi lựa chọn, toàn bộ đơn TikTok trên bảng tự động cập nhật lại cột `Tổng Giá Trị` ngay lập tức.
              4. 📦 **Tự động lấy 100% Mã vận đơn cột `[R]` & Hỗ trợ lọc đơn HỦY chưa gửi hàng**:
                 - Tự động điền chuẩn 100% Mã vận đơn (`8626...`, `TTVN...`) từ cột `[R] Mã vận đơn` của file TikTok/Salework và luôn ghi đè cập nhật thông tin mới khi nạp lại file. Có thêm tùy chọn tự động bỏ qua các đơn khách bấm `HỦY` trước khi gửi hàng (vốn để trống cột Mã vận đơn trong file Excel gốc).
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
