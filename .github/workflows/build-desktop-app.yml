name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.0
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.0 (Một Đơn Một Dòng Tổng, Bấm Mở Chi Tiết SP, Sửa Lỗi Đơ Nhập Liệu, Sắp Đến Hạn & Quá Hạn)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.0

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.0`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.0.exe`)
            - **Điểm nâng cấp & tính năng mới trong v1.3.0**:
              1. ⚡ **Một Đơn Một Dòng Tổng — Triệt Tiêu 100% Lỗi Lag/Đơ Khi Nhấp Con Trỏ Nhập Văn Bản**:
                 - Tái cấu trúc bảng chính sang kiến trúc 1 đơn = đúng 1 dòng tổng gọn gàng (không bung rowspan nhiều dòng làm phình to DOM).
                 - Tốc độ cuộn trang và nhấp chuột gõ chữ đạt chuẩn 60fps mượt mà, phản hồi tức thì kể cả khi có hàng nghìn đơn và ảnh chụp.
              2. 👁️ **Bấm Xem / Sửa Chi Tiết Từng Sản Phẩm Trong Đơn (Product Drawer/Accordion)**:
                 - Cột Sản phẩm hiển thị tóm tắt: `📦 N loại (M SP)` kèm nút `👁️ Chi tiết (N)`.
                 - Bấm vào sẽ mở rộng bảng con ngay bên dưới dòng đơn để xem chi tiết tên, màu sắc, size, số lượng, thêm bớt sản phẩm dễ dàng.
              3. ⏰ **Cột "Hạn Cần Xử Lý" & Bộ Lọc Sắp Đến Hạn (≤ 48h) / Quá Hạn**:
                 - Tự động trích xuất hạn chót từ file Shopee (`Người Bán cần phản hồi trước` / `Thời hạn khiếu nại`).
                 - Đánh dấu trực quan: `⏰ Gấp (≤48h)` (màu cam) và `🚨 Quá hạn` (màu đỏ).
                 - Bấm chuột trái để chỉnh sửa hạn xử lý nhanh chóng; nhấp chuột phải để xem lịch sử chỉnh sửa.
              4. 🔍 **Khắc Phục Hoàn Toàn Lỗi Bộ Lọc Bảng Thống Kê 300+ SKU**:
                 - Khi lọc theo Tên sản phẩm, Màu sắc, Size (ví dụ gõ "quần" + size "S"): bảng lọc tức thì, huy hiệu hiển thị chuẩn xác số phân loại khớp.
                 - Nếu không có phân loại nào khớp, hiển thị thông báo rõ ràng kèm gợi ý bộ lọc thay vì giữ lại các dòng cũ.
              5. 📱 **Phục Hồi Camera Quét Khi Tắt Màn Hình Điện Thoại Bật Lại**:
                 - Khắc phục triệt để hiện tượng màn hình đen khi khóa màn hình điện thoại rồi bật lại.
                 - Tự động đồng bộ và kích hoạt lại luồng camera mượt mà, hỗ trợ chạm vào màn hình để làm mới ngay mà không cần thoát ra vào lại.
              6. 📦 **Đầy Đủ 4 Đề Xuất Đối Soát & Xuất File Excel Đơn Đã Về Kho**:
                 - Tách mã vận đơn giao và hoàn: ưu tiên mã hoàn khi nhận kiện, hỗ trợ quét cả 2 mã.
                 - Tách trạng thái sàn và tình trạng nhận tại kho: `⏳ Chưa nhận`, `🟢 Đã nhận`, `⚪ Không cần nhận` (đơn hủy trước gửi), `🔴 Bị mất`.
                 - Xuất file Excel 2 Sheet chuyên nghiệp cho đơn đã về kho.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
