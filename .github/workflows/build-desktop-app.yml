name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.8
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.8
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.8 (Tách Riêng Cột Ghi Chú Người Mua, Xuất File Đơn Đã Về Kho)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.8

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.8`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.8.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.8**:
              1. 📝 **Tách riêng cột `"Ghi Chú Người Mua"` độc lập với `"Lý Do Hoàn"`**:
                 - **`Lý Do Hoàn`**: Ghi nhận lý do trả hàng, lý do hủy, lý do giao thất bại từ hệ thống sàn Shopee / TikTok.
                 - **`Ghi Chú Người Mua`**: Trích xuất chính xác nhận xét, lời nhắn khi khách bấm trả hàng hoặc khi đặt đơn.
                 - Tự động nhận diện từ cả 5 file Excel thực tế của Shop:
                   - Shopee Trả hàng/Hoàn tiền: trích xuất cột `Lí do Trả hàng/Hoàn tiền` và `Ghi chú của Người mua khi trả hàng` / `Ghi chú của Người mua khi đặt hàng`.
                   - Shopee Đơn hủy: trích xuất cột `Lý do hủy` và `Nhận xét từ Người mua` / `Ghi chú`.
                   - Shopee Giao hàng thất bại: trích xuất lý do `Giao hàng thất bại` và `Nhận xét từ Người mua` / `Ghi chú`.
                   - TikTok / Salework: trích xuất trạng thái/lý do `THẤT THU / HỦY` và cột `Ghi chú của khách` (cột U) / `Ghi chú`.
              2. 📦 **Tính năng mới `"Xuất File Đơn ĐÃ VỀ KHO (.xlsx)"`**:
                 - Xuất riêng các đơn đã thực nhận tại kho (`o.status === 'Hàng đã trả'`) ra file Excel với **2 Sheet chuyên nghiệp**:
                   - **Sheet 1: `1_Don_Da_Ve_Kho_Chi_Tiet`**: Toàn bộ chi tiết từng đơn hàng đã về kho (STT, Ngày & Giờ Về Kho, Sàn TMĐT, Loại Đơn, Mã Vận Đơn, Mã Đơn Hàng, ĐVVC, Tên SP, Màu Sắc, Size, Số Lượng, Giá Trị, Lý Do Hoàn, Ghi Chú Người Mua, Ngày Gửi Đi, Ngày Hoàn/Hủy).
                   - **Sheet 2: `2_Tong_Ket_SP_Nhap_Lai_Kho`**: Bảng tổng kết số lượng sản phẩm theo Tên SP, Màu Sắc, Size của các kiện đã về kho để thủ kho và kế toán nhập lại kho tức thì (kèm cột Ký nhận và dòng Tổng cộng).
              3. ⚡ **Nút bấm tắt nhanh `"📥 Xuất Đơn Đã Về"`**:
                 - Đặt ngay trên thanh công cụ tab trạng thái (cạnh tab `🟢 Đã về kho`) và trong menu `📂 Nhập / Xuất Dữ Liệu` có badge đếm số lượng đơn đã về kho thực tế.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
