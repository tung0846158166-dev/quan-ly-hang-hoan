name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.7.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.7.2 (Tương Thích Toàn Diện Cả 2 Định Dạng File Xuất TikTok Shop)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.7.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.7.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.7.2.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.7.2**:
              1. 📦 **Tương thích toàn diện cả 2 định dạng file xuất của TikTok Shop Seller Center**:
                 - **Định dạng 1**: File Báo Cáo Trả Hàng / Hoàn Tiền (`Return Order ID`, `Return Logistics Tracking ID`, `Time Requested`,...).
                 - **Định dạng 2**: File Danh Sách Đơn Hàng (`Order ID`, `Tracking ID`, `Order Status = Đã hủy`, `Cancel Reason = Giao gói hàng thất bại`, `Cancelled Time`,...).
                 - Tự động nhận diện chuẩn xác đơn bom / giao thất bại, trích xuất chuẩn Mã vận đơn, Mã đơn hàng, ngày gửi, ngày hoàn, phân loại màu & size, giá tiền sau chiết khấu.
                 - Khắc phục triệt để lỗi xung đột từ khóa "chuyen" (vận chuyển/trung chuyển) với "huy".
              2. 🏷️ **Tách riêng biệt không gian Sàn Shopee & TikTok Shop**: Hai tab độc lập `🟠 SÀN SHOPEE` và `⚫ SÀN TIKTOK SHOP` kèm tính năng ghi nhớ thông minh.
              3. 📱 **Bộ quét Camera Dual Scan Engine siêu nhạy**: Quét cực nhanh mã vạch 1D và QR code di động, giữ yên 0.5s tự động nhận diện và đồng bộ.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
