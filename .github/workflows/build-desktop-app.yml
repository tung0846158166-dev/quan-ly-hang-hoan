name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.2
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.2
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.8.2 (Chống Trùng Đơn Khi Tạo Nhanh, Quét Mã Vạch 40 FPS & Chuẩn Hóa Chờ Về)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.8.2

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.8.2`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.8.2.exe`)
            - **Các cải tiến mới nhất trong phiên bản v1.8.2**:
              1. 🛡️ **Kiểm Soát & Chống Trùng Đơn Thông Minh Khi Tạo Nhanh**:
                 - Khi dán danh sách mã vào bảng Tạo Đơn Nhanh, hệ thống tự động đối chiếu với toàn bộ đơn ngoài Bảng chính.
                 - Nếu mã đã có sẵn, dòng đó sẽ được gắn nhãn cảnh báo trực quan: `⚠️ ĐÃ CÓ TRÊN BẢNG: Chờ về (Chưa nhận)` hoặc `⚠️ ĐÃ CÓ: Đã nhận kho (ngày...)`.
                 - **Tự động bỏ tích (uncheck)** các đơn đã có sẵn để khi bấm *[📥 Đưa Đơn Đã Chọn Ra Ngoài]* sẽ chỉ đưa những đơn thực sự mới ra ngoài, không lo bị nhân đôi đơn.
                 - Bổ sung nút **[⚡ Chỉ chọn đơn mới]** để tích chọn toàn bộ đơn mới và bỏ chọn toàn bộ đơn trùng chỉ với 1 cú click.
                 - Bổ sung nút **[🛡️ Xóa đơn trùng]** để thanh lọc ngay lập tức toàn bộ các mã đã có ra khỏi danh sách tạo nhanh.
                 - Nếu người dùng chủ động tích chọn đơn trùng để đưa ra ngoài, hệ thống sẽ đưa ra hộp thoại lựa chọn thông minh: **Cập nhật thông tin vào đơn cũ** (không tạo dòng trùng) hoặc **Vẫn tạo thêm dòng mới**.
              2. ⚡ **Bảng Tạo Đơn Nhanh Hàng Loạt ([⚡ TẠO ĐƠN NHANH])**:
                 - Tự động tách dòng, xóa dấu `-` và khoảng trắng.
                 - Chọn Sàn TMĐT (Shopee, TikTok Shop, Lazada, Khác) và Loại đơn hoàn đồng loạt.
                 - Đơn mới luôn ở trạng thái chuẩn **"Chưa nhận (Chờ về)"**.
              3. ⏳ **Quy Trình Kho Chuẩn Tuyệt Đối**:
                 - Đơn mới luôn mặc định là "Chờ về (Chưa nhận)", chỉ khi nhân viên quét hoàn kho thực tế trên điện thoại mới chuyển sang "Đã nhận".
              4. 📱 **Nâng Cấp Quét Mã Vạch 40 FPS**:
                 - Bắt nét siêu tốc tương đương Salework, xoay đa hướng 90°, không bị giật lag.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
