name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master, fix/audit-17-regressions, fix/return-parcels-sync, fix/phone-ack-recovery, fix/phone-result-delivery ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Acquire production SheetJS engine for real workbook tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $enginePath = Join-Path $env:RUNNER_TEMP 'sheetjs-engine.cjs'
          Invoke-WebRequest -Uri 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js' -OutFile $enginePath
          node -e "const x=require(process.argv[1]); if(x.version!=='0.20.1') throw new Error('Unexpected SheetJS engine version: '+x.version); console.log('SheetJS '+x.version);" $enginePath

      - name: Test storage, phone, Excel and UI regressions
        run: npm test
        env:
          XLSX_ENGINE_PATH: ${{ runner.temp }}/sheetjs-engine.cjs

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.9.55
          path: |
            dist/*.exe
            dist/*.blockmap
            mobile_scanner.html
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.55
          name: "Quản Lý Hàng Hoàn v1.9.55 — Sửa kho lưu trữ bị ghi đè bản cũ, báo rõ lý do khi không dời được đơn"
          body: |
            ### Bản 1.9.55

            - 📦 Kho lưu trữ: sửa lỗi bản ghi ra ổ cứng có thể bị ghi đè lại bằng bản cũ (localStorage) ngay sau khi mở app, làm đơn vừa dời vào kho biến mất khi mở lại. Nay khi kho chỉ có bản mới trên ổ cứng thì không bị ghi đè.
            - 🔎 Nút "Quét & Dời Đơn >24h Ngay" nay báo rõ LÝ DO nếu chưa dời được (kho đầy, ghi ổ cứng lỗi, lưu bảng chính lỗi, hoặc thật sự chưa có đơn quá 24h). Lần dời bị treo quá 2 phút tự được chạy lại.

            ### Bản 1.9.54

            - 📋 Cột "Nhận Tại Kho" chuyển lên đứng trước cột "Tổng Giá Trị" để không bị che phải kéo ngang. Cột "Sản Phẩm & Phân Loại" nhỏ lại thêm.
            - 👁 Bảng "Chi tiết" khi mở nay vừa đúng chiều rộng màn hình (không phải kéo ngang) và đứng yên khi kéo bảng. Bấm ra ngoài bất kỳ chỗ nào ngoài bảng chi tiết thì bảng tự ẩn; bấm trong bảng, trong hộp thoại đang mở hoặc nút "Chi tiết" của đơn khác thì không bị ẩn nhầm.

            ### Bản 1.9.53

            - 🧹 Bảng chính gọn hơn: bỏ cột "Hàng Đặt Trước" và ô lọc Trước/Thường (dữ liệu cũ vẫn được giữ trong file). "Ngày Gửi Đi" chỉ hiện ngày (bấm vào ô vẫn thấy và sửa được cả giờ). Cột "Sàn" thành chấm màu: cam = Shopee, đen = TikTok Shop (xanh = Lazada, xám = Khác); bấm chấm vẫn đổi được sàn. Các cột ngày, loại, trạng thái, sản phẩm, ghi chú được thu hẹp để bảng đỡ phải kéo ngang.
            - 📦 Sửa lỗi đơn đã nhận quá 24h nhưng không vào Kho Lưu Trữ: kho lưu trữ chứa nhiều ảnh nên vượt dung lượng localStorage (~5 MB) và việc lưu thất bại âm thầm, đơn bị giữ lại bảng chính. Nay bản desktop ghi kho ra file trên ổ đĩa, ghi xong mới dời đơn khỏi bảng chính (lỗi thì giữ nguyên đơn). Các đơn đang chờ sẽ được dời ở lần kiểm tra kế tiếp (sau khi mở app ~1 giây, hoặc mở "Kho Lưu Trữ" / bấm quét).

            ### Bản 1.9.52

            - 🔧 TikTok (file Salework): cột "Trạng thái kiện" không còn hiện lý do hoàn tiếng Anh (Change of mind, Ordered wrong size...). Nay hiện tình trạng kiện: có mã trả hàng = "Đang về", chưa có = "Chờ khách gửi hàng". Lý do hoàn vẫn nằm ở ô Ghi chú, đã dịch sang tiếng Việt (thêm "Wrong product sent" = Shop gửi sai sản phẩm). Đơn cũ tự sửa ở lần "Lấy ngay" kế tiếp.
            - ⏰ Shopee (Google Sheet): Hạn cần xử lý = "Về shop lúc" + 1 ngày (Shopee cho khiếu nại 2 ngày, shop lấy mốc 24h để xử lý sớm). Không có "Về shop lúc" thì giữ hạn của Sheet. Đơn Shopee đã có trong bảng tự đổi sang mốc mới ở lần đồng bộ Sheet kế tiếp, trừ ô bạn đã sửa tay hoặc đang khoá. Chỉ áp dụng cho Shopee.

            ### Bản 1.9.51

            - 🔎 Bộ lọc nâng cao có thêm 2 ô: "Loại (theo sàn)" (đúng chữ Loại của Google Sheet) và "Trạng thái kiện" (Chờ khách gửi hàng, Đang về, Đã về shop...). Danh sách tự lấy từ dữ liệu hiện có, kèm số đơn; tính vào huy hiệu số bộ lọc đang bật và được xoá khi bỏ lọc.

            ### Bản 1.9.50

            - 🏷 Bảng chính: chữ "Loại" của Google Sheet (Chỉ hoàn tiền / Trả hàng + hoàn tiền / Đang chờ huỷ...) nay hiện nguyên văn ngay dưới ô chọn ở cột "Loại (theo sàn)". Đổi tên 2 cột cho rõ: "Loại (theo sàn)" = loại yêu cầu trên sàn; "Trạng thái kiện" = tình trạng kiện hàng (Chờ khách gửi hàng, Đang về...). Dữ liệu cũ không đổi.

            ### Bản 1.9.49

            - 🤖 Salework tự động: đơn đã có sẵn dòng cũ chưa có mã vận đơn mà không gộp được (dòng đang khoá ô, hoặc đơn có nhiều kiện khác mã hoàn) trước đây vẫn hiện trống mã dù Salework có. Nay app ĐIỀN mã giao / mã hoàn còn trống vào dòng đó (chỉ điền ô trống, không ghi đè, không xoá dòng nào, bỏ qua ô mã đang khoá, nhiều kiện thì chỉ điền mã chung chắc chắn). Thông báo cuối lần chạy cho biết số dòng đã điền.

            ### Bản 1.9.48

            - 🤖 Salework tự động: menu "Xuất excel" của Salework mở khi RÊ CHUỘT vào nút (không phải bấm). App nay dùng chuột thật: rê vào Xuất excel, rồi di chuột bấm "Theo bộ lọc" và "Bắt Đầu Xuất". Trước khi bấm bằng chuột, app kiểm tra điểm bấm rơi đúng vào nút và không phải chữ "cập nhật", bị che thì dừng. Rê chuột chưa mở menu thì mới thử bấm nút.

            ### Bản 1.9.47

            - 🤖 Salework tự động: sau khi chọn "Theo bộ lọc", nút "Bắt Đầu Xuất" có thể đổi chữ hoặc được vẽ lại trong lúc app chờ (lỗi thật của người dùng: không thấy "Bắt Đầu Xuất"). App nay tìm theo đầu chữ, tìm lại và thử bấm lại tới 6 giây, và báo kèm các chữ đang thấy nếu vẫn không được.

            ### Bản 1.9.46

            - 🤖 Salework tự động: sau khi bấm Xuất excel app đợi cửa sổ xuất hiện (tới 8 giây) và tìm "Theo bộ lọc" / "Bắt Đầu Xuất" trên cả trang; báo lỗi kèm các chữ đang thấy trên trang. Ở chế độ xem, khi lỗi app GIỮ cửa sổ Salework lại (có dòng đỏ báo bước lỗi, tự đóng sau 2 phút) để bạn nhìn thấy.

            ### Bản 1.9.45

            - 🤖 Salework tự động: mở trang đã lưu mà chỉ thấy menu bên trái, phần Đơn hoàn trống (lỗi thật của người dùng) thì app tự đi menu Kiểm tra, đối soát › Đơn hoàn như bạn vẫn làm rồi chạy tiếp.

            ### Bản 1.9.44

            - 🤖 Salework tự động: chế độ xem (mặc định BẬT) — cửa sổ Salework hiện ra, nút sắp bấm có viền đỏ và chờ vài giây rồi mới bấm; có nút ⛔ Dừng trong app, đóng cửa sổ cũng dừng ngay. Báo lỗi kèm trang đang ở và các nút nhìn thấy; hiện địa chỉ trang đã lưu.

            ### Bản 1.9.43

            - 🤖 Salework tự động: Salework mở app Kho / Chat ở cửa sổ mới làm app lưu nhầm trang — nay mọi thứ mở trong MỘT cửa sổ. Dán link đăng nhập nhân viên rồi bấm Đăng nhập Salework khi cửa sổ đang mở sẽ chuyển sang link đó.

            ### Bản 1.9.42

            - Menu ☰ › 🤖 Salework tự động (đang chờ hoàn): đăng nhập Salework một lần, lưu trang Đơn hoàn, bấm Lấy ngay — app mở cửa sổ ẩn, vào tab Đang chờ hoàn, bấm Xuất excel › Theo bộ lọc › Bắt Đầu Xuất rồi nạp file vào bảng. Không đụng TikTok, không bấm Cập nhật đơn hoàn, bỏ tên / SĐT / địa chỉ khách. Bản này chỉ chạy bằng tay (chưa tự chạy theo giờ).

            ### Bản sửa 1.9.38

            - Quét mã vận đơn trả hàng mới (khác mã vận đơn cũ của đơn) mà phiếu đọc được mã phiếu trả hàng / mã đơn khớp đúng 1 đơn: gắn mã vừa quét vào đơn đó và ghi Hàng đã trả, không tạo đơn tạm.
            - Đơn tạm "Chưa rõ sản phẩm (hàng đã về, chưa có đơn)" có mã là mã phiếu trả hàng / mã đơn / mã vận đơn của đúng 1 đơn thật: tự gộp vào đơn thật (Hàng đã trả, ngày nhận, ảnh, mã vận đơn vừa quét) sau mỗi lần đồng bộ và trong Dọn Đơn Trùng.

            ### Bản sửa 1.9.37

            - Gộp dòng trùng mã đơn ở Bảng chính sau mỗi lần đồng bộ Sheet / tự nạp file TikTok và trong Dọn Đơn Trùng. Chạy trên dữ liệu thật (2.896 đơn): 423 mã đơn có nhiều dòng còn 22 (là các kiện / yêu cầu khác nhau), gỡ 427 dòng, không gỡ dòng nào đã nhận; Báo Đỏ 1.209 còn 957.
            - Dòng giữ nhận trạng thái sàn mới nhất của Sheet; dữ liệu kho của dòng gỡ được chuyển sang dòng giữ.

            ### Bản sửa 1.9.36

            - Cùng mã đơn có dòng mới (đã có mã vận đơn, vd Đã về shop) và dòng cũ (chưa có mã vận đơn, vd Chờ bạn xác nhận hàng trả về): sau mỗi lần đồng bộ app giữ dòng khớp Google Sheet (ưu tiên dòng có mã vận đơn), gỡ dòng cũ. Dữ liệu kho của dòng cũ (đã nhận, ngày nhận, ảnh, ghi chú, theo dõi) được chuyển sang dòng giữ. Hai kiện có mã vận đơn khác nhau vẫn giữ cả hai.

            ### Bản sửa 1.9.35

            - Nhiều dòng cùng mã đơn (không có mã vận đơn riêng) ở Bảng chính: giữ dòng khớp Google Sheet (cùng mã yêu cầu hoặc cùng trạng thái sàn), gỡ các dòng còn lại chưa nhận và chưa có dữ liệu kho. Trước đây sót trường hợp 2 dòng cùng mã yêu cầu hoặc dòng cũ không có mã yêu cầu.
            - Dán mã vận đơn của một lượt quét trong Hộp Đơn Mới vào ô Mã vận đơn của đơn đã có: đơn được ghi Hàng đã trả và bảng vẽ lại ngay (trước đây hộp được gỡ nhưng bảng vẫn hiện Chưa nhận).

            ### Bản sửa 1.9.34

            - Menu ☰ › 📂 Tự nạp file TikTok: dán đường dẫn (hoặc chọn) thư mục bạn tải file từ TikTok Seller Center. App kiểm tra mỗi 15 giây, file TikTok mới tải xong được nạp tự động như bấm Nạp File TikTok. File không phải của TikTok, file đã nạp, file có sẵn trước khi bật được bỏ qua; app không xoá / sửa file nào. Có nút nạp các file TikTok đang có trong thư mục.

            ### Bản sửa 1.9.33 (dùng cùng app iPhone 0.10.31)

            - Đang quét liên tục thì máy tính hoãn gửi cả danh sách đơn sang iPhone (gửi khi ngừng quét 45 giây, chậm nhất 3 phút một lần) để iPhone không phải ghép, giải nén, vẽ lại liên tục.
            - iPhone 0.10.31: camera 24 hình/giây, 15 giây không thấy mã thì 15 hình/giây, 30 giây không quét thì tự nghỉ (chạm để quét tiếp); máy nóng thì giảm còn 12 hình/giây, quá nóng thì tạm dừng. Bỏ đổ bóng quanh khung camera, bớt vẽ lại màn hình khi đang nhận danh sách. Thêm nút Dán cạnh nút Đèn / Zoom để dán mã đã chép ở ứng dụng khác.

            ### Bản sửa 1.9.32

            - Khách huỷ yêu cầu trả hàng rồi tạo yêu cầu mới cho cùng đơn: Google Sheet chỉ còn yêu cầu mới, dòng của yêu cầu cũ ở Bảng chính không được cập nhật nữa nên bị trùng mã đơn. Sau mỗi lần đồng bộ app tự gỡ dòng yêu cầu cũ (chỉ khi chưa nhận, không có mã vận đơn riêng, ảnh, ghi chú, theo dõi hay ô khóa). Nút Dọn Đơn Trùng cũng dọn được các dòng này. Có lưu bản sao.

            ### Bản sửa 1.9.31 (dùng cùng app iPhone 0.10.29)

            - Sau khi iPhone đẩy đơn mới / đánh dấu đơn hủy, nếu máy tính đang gửi dở danh sách thì hẹn gửi lại thay vì bỏ qua.
            - iPhone 0.10.29: Bảng đơn mới cập nhật ngay mỗi khi máy tính gửi danh sách (bản trước chỉ thấy sau khi tắt mở lại app).

            ### Bản sửa 1.9.30 (dùng cùng app iPhone 0.10.28)

            - Gửi cột Trạng thái sàn sang iPhone. iPhone có bảng "Hủy sau chuẩn bị": các đơn ở Bảng chính có Trạng thái sàn ghi Huỷ sau chuẩn bị, lọc Chưa nhận / Đã nhận / Tất cả, tích chọn để đánh dấu Hàng đã trả hoặc Không cần nhận. Chi tiết đơn trên iPhone hiện thêm Trạng thái sàn.

            ### Bản sửa 1.9.29

            - Dán một loạt mã đơn / mã vận đơn vào ô TÌM (cách nhau bằng dấu cách, xuống dòng, dấu phẩy): app tìm từng mã và liệt kê mã đó ở Bảng chính (số dòng, trạng thái), Kho lưu trữ, Bảng đơn hủy, Hộp đơn mới hay không có; có nút chép các mã không có và nút chỉ hiện các đơn có ở Bảng chính. Chữ thừa như "(2 dòng sản phẩm)" tự bỏ qua.

            ### Bản sửa 1.9.28

            - Đơn hàng về kho được quét khi chưa có đơn (mã đơn tạm = mã vận đơn) rồi sang Kho lưu trữ, sau đó Google Sheet (tab Huỷ không có mã vận đơn) tạo thêm đơn cùng mã đơn ở Bảng chính: sau mỗi lần đồng bộ app tự gỡ đơn chưa nhận ở Bảng chính nếu đơn đó đã có ở Kho lưu trữ / Bảng đơn hủy, và chuyển thông tin sàn (sản phẩm, trạng thái) sang bản ở kho. Không gỡ đơn đã nhận, có ảnh, ghi chú, theo dõi hoặc ô khóa. Có lưu bản sao.

            ### Bản sửa 1.9.27 (dùng cùng app iPhone 0.10.27)

            - Gửi Hộp Đơn Mới sang iPhone; iPhone tích chọn đơn để đẩy ra Bảng chính hoặc đẩy ra hết (đơn đã có ở bảng khác chỉ gỡ khỏi hộp, lượt quét ở kho ghi Hàng đã trả).
            - iPhone tích chọn đơn trong Bảng đơn hủy để đánh dấu Đã nhận / Chưa nhận, hoặc nhận hết đơn chưa nhận.
            - Thanh chuyển trang dưới bảng thấp lại còn một dòng (~27px), bảng có thêm chỗ.

            ### Bản sửa 1.9.26

            - Thanh chuyển trang (◀ Trang x/y ▶, số đơn/trang, Đến trang) bị đẩy xuống dưới thanh tổng ở đáy màn hình khi mở Bộ lọc nâng cao: chiều cao bảng giờ tự tính lại theo phần đầu trang, thanh chuyển trang luôn hiện ngay dưới bảng.

            ### Bản sửa 1.9.25

            - Google Sheet: ô "Lấy đơn từ ngày" nhận ngày cố định (vd 01/11/2026): luôn lấy đơn từ ngày đó đến nay và tiếp tục cập nhật, không bị trôi mất đơn đầu tháng như khi ghi số ngày gần nhất. Vẫn nhận số ngày (vd 30) như cũ.

            ### Bản sửa 1.9.24

            - Google Sheet: đọc cả 3 tab "Hàng hoàn", "Trả hàng", "Huỷ · chi tiết" và GHÉP thành 1 đơn cho mỗi mã đơn hàng: ô có ở nhiều tab lấy giá trị mới nhất (theo cột Cập nhật), ô chỉ một tab có (mã vận đơn, màu/size ở tab Hàng hoàn; ghi chú khách ở tab Trả hàng) được giữ; tab nào báo Bom thì đơn là Bom. Không còn đơn trùng.
            - Tab Huỷ: bỏ qua loại "Huỷ trước chuẩn bị" (hàng chưa đóng gói). Có ô tự chọn thêm loại bỏ qua (vd Chưa thanh toán; Chỉ hoàn tiền) và ô "chỉ lấy đơn trong N ngày gần nhất".
            - Các lần tự cập nhật sau chỉ nạp đơn mới hoặc đơn Shopee vừa đổi dữ liệu; bấm "Cập nhật ngay" thì nạp lại toàn bộ.
            - Chịu tải 50.000 đơn: bộ nhớ tra cứu lớn được lưu vào IndexedDB (trước đây vượt hạn mức localStorage nên nạp nhiều đơn bị từ chối và phục hồi); nạp nhanh hơn ~3 lần; bảng bộ nhớ tra cứu chỉ dựng khi mở và hiện tối đa 1.000 dòng (có ô tìm).

            - Google Sheet: đọc đúng kiểu tab "Hàng hoàn" (Mã | Mã đơn | Loại | Mã vận đơn | Trạng thái về | Về shop lúc | Hạn khiếu nại | Hàng | SL | Tiền | Lý do | Ngày). Cột Hàng có nhiều sản phẩm ("TÊN · Màu, Size × SL; …") được tách đúng từng sản phẩm, màu, size, số lượng; Loại "Bom" thành Giao không thành công; Trạng thái về thành Trạng thái sàn; Lý do, Ngày, Tiền, Hạn khiếu nại vào đúng cột.
            - Đoạn mã Apps Script đọc sheet qua Google Sheets API (chỉ cần quyền XEM; bản cũ dùng SpreadsheetApp.openById bị Google đòi quyền sửa nên báo lỗi "Các quyền được chỉ định không đủ"). Tệp kê khai tự bật Google Sheets API.
            - Một đơn có nhiều yêu cầu (khách hủy rồi gửi lại, chỉ hoàn tiền rồi đổi sang trả hàng, bom rồi xin hoàn tiền…): chỉ giữ 1 yêu cầu — yêu cầu còn hiệu lực mới nhất; nếu tất cả đã hủy thì lấy cái mới nhất.
            - Nạp lại (file Excel hoặc Google Sheet) chỉ báo "Cập nhật đơn" cho đơn thật sự thay đổi; trước đây mỗi lần nạp lại báo cho mọi đơn.
            - Tự cập nhật từ Google Sheet vẫn chạy khi bảng đang khóa (không bật hộp mật khẩu mỗi 10 phút).

            ### Bản sửa 1.9.23

            - Mới: tự cập nhật đơn Shopee từ Google Sheet mỗi 10 phút (menu ☰ › 🔗 Google Sheet). Kết nối qua một dự án Apps Script RIÊNG (tạo tại script.google.com, chỉ đọc sheet, không đụng đoạn mã hay phần mềm khác đang dùng sheet), có mã bí mật riêng; chỉ đọc các tab được chọn (vd "Hàng hoàn; Trả hàng"); sheet được nạp như file Excel Shopee: đơn đã có (bảng chính, kho lưu trữ, bảng đơn hủy) chỉ cập nhật, đơn chưa có thì thêm mới; sheet không đổi thì bỏ qua. Có trạng thái lần cập nhật gần nhất và nút cập nhật ngay.

            ### Bản sửa 1.9.22

            - Thống kê "Bảng chính + kho lưu trữ": kho lưu trữ nay lọc theo đúng sàn / tuần / bộ lọc đang chọn như bảng chính (trước đó lấy hết kho lưu trữ bất kể bộ lọc nên lệch). Có dòng cộng: Bảng chính + Kho lưu trữ (bỏ đơn trùng) = Tổng.
            - Thêm bảng "Theo sàn": Shopee, TikTok Shop và Tổng, cho đơn hoàn (số đơn, đã về, còn chờ, khác, quá hạn, sắp hạn) và đơn hủy; bấm số để xem danh sách đơn.
            - Sàn của các bảng theo ngày đi theo tab sàn của bảng chính.

            ### Bản sửa 1.9.21

            - Làm lại bảng thống kê: mỗi loại (đơn hoàn, đơn hủy) một bảng theo ngày/tuần/tháng. Bên trái: đơn về kho trong ngày (theo ngày nhận; đơn hoàn tách Bảng chính / Lưu trữ). Bên phải: đơn hoàn/hủy phát sinh trong ngày và tình trạng hiện tại, Số đơn = Đã về + Còn chờ + Khác (không cần nhận / bị mất / hư hỏng).
            - Có dòng TỔNG và dòng "Chưa có ngày" ngay trong bảng (trước đó đơn thiếu ngày bị bỏ ra ngoài làm các bảng lệch nhau).
            - Phạm vi mặc định "Đúng như bảng chính đang hiển thị": dùng chung bộ lọc với các tab (sàn, tuần, khoảng ngày, loại đơn…), có dòng đối chiếu ✓ với số trên tab Tất cả / Đã nhận / Chưa nhận / K.cần nhận + Bị mất / Báo Đỏ / Báo Vàng. Chọn "Toàn bộ" để tính cả kho lưu trữ.
            - Bấm vào bất kỳ con số nào để xem đúng danh sách đơn tạo nên con số đó (mã vận đơn, mã đơn, ngày hoàn, ngày về kho, trạng thái, nằm ở bảng nào).
            - Đơn nằm ở cả bảng chính và kho lưu trữ chỉ tính 1 lần ở mọi bảng.

            ### Bản sửa 1.9.20

            - Thanh phân trang ngay dưới bảng: "Đang xem đơn 1–50 / N đơn", nút ◀ ▶, số đơn mỗi trang, ô đến trang (bản 1.9.19 bị đẩy ra ngoài màn hình).
            - Thống kê "Đơn hoàn đã về kho" tách cột Bảng chính / Lưu trữ: đơn đã nhận quá 24 giờ tự chuyển sang kho lưu trữ nên tab "Đã nhận" chỉ còn phần Bảng chính. Đơn nằm ở cả 2 nơi chỉ tính 1 lần.

            ### Bản sửa 1.9.19

            - Bố cục ứng dụng: menu ☰ trượt ra đè lên bảng (không thu hẹp bảng), bấm ra ngoài hoặc Esc tự đóng; ô tìm kiếm lên thanh trên; phần trên bảng còn 3 hàng một dòng; tiêu đề bảng một màu, hàng thấp hơn để thấy nhiều đơn hơn.
            - Rà toàn bộ bộ đếm (67 phép kiểm tra trên app thật): mọi nơi dùng chung một cách tính Báo Đỏ/Báo Vàng (tab lọc, danh sách khi bấm tab, ô tổng quan, bảng Thông báo, cảnh báo nổi, bảng Theo dõi, thống kê, danh sách gửi điện thoại).
            - Sửa: đơn Hư hỏng không còn bị báo quá hạn / lọt vào danh sách Báo Vàng/Đỏ; "Chưa về" ở thanh tổng không tính đơn Hư hỏng và ghi rõ đơn vị SP; số trên nút lọc bảng Theo dõi khớp số dòng.
            - Sửa: điện thoại nay thấy đơn hủy quá hạn / sắp hạn giống bảng Thông báo PC; đơn có hạn sàn được tính giống nhau trên PC và điện thoại.
            - Thống kê: đơn hoàn = toàn bộ bảng chính + kho lưu trữ, đơn hủy = bảng đơn hủy (PC và điện thoại giống nhau).
            - Sửa lỗi danh sách khiếu nại đơn quá 72 giờ không mở được (lỗi biến).
            - Giao diện mới: thanh tiêu đề dải màu, bảng dạng danh sách (hàng kẻ nhẹ, tô xen kẽ, tiêu đề cố định, rê chuột sáng hàng), nút và ô nhập bo tròn, cửa sổ bo góc có hiệu ứng, thanh cuộn mảnh. Chức năng giữ nguyên.

            - Bảng thống kê: chọn xem cả 2 sàn, riêng Shopee hoặc riêng TikTok Shop (cả trên máy tính và iPhone).

            - Thống kê: thêm bảng "Đơn hoàn đã về kho" và "Đơn hủy đã nhận" theo ngày nhận tại kho (đơn đã chuyển sang Đã nhận). Danh sách gửi sang iPhone kèm ngày nhận để iPhone thống kê giống máy tính.

            - Nút "📊 THỐNG KÊ": thống kê đơn hoàn (gồm kho lưu trữ) và đơn hủy (bảng đơn hủy) theo ngày, tuần, tháng, kèm số đơn đã nhận, đang chờ, sắp đến hạn dưới 24 giờ và quá hạn.

            - Bảng đơn hủy: thêm lọc theo ngày (từ ngày – đến ngày), chọn lọc theo Ngày hủy hoặc Ngày nhận hàng; nút "Xóa lọc" xóa luôn cả khoảng ngày.

            ### Bản sửa 1.9.14

            - Lượt quét nằm trong hàng chờ điện thoại (quét lúc máy tính tắt hoặc mất kết nối): khi máy tính bật lại, đối chiếu mà vẫn không có đơn thì đưa vào Hộp Đơn Mới ngay (kèm giờ quét và ảnh). Lượt quét trực tiếp lúc cả hai máy đang bật mà chưa có đơn vẫn chờ 10 phút để kịp nạp file sàn.
            - Nạp file sàn có đơn đã nằm ở Kho lưu trữ hoặc Bảng đơn hủy (kể cả đơn tạo từ điện thoại): không tạo đơn mới ở bảng chính, chỉ bổ sung thông tin (mã đơn thật, sản phẩm, trạng thái sàn, hạn xử lý…) cho đơn đó; trạng thái nhận hàng, ngày nhận và ảnh giữ nguyên.

            ### Bản sửa 1.9.13

            - Mã điện thoại đã quét mà sau 10 phút vẫn chưa có đơn (file sàn thiếu): máy tính tự đưa vào Hộp Đơn Mới kèm giờ quét, để không bỏ sót hàng đã về. Đẩy ra Bảng chính sẽ ghi sẵn "Hàng đã trả". Nếu sau đó file sàn có đơn thì tự đánh dấu đã nhận và gỡ khỏi hộp; mã có ở Kho lưu trữ/Bảng đơn hủy thì không tạo.

            ### Bản sửa 1.9.12

            - Điện thoại quét một mã mà lúc đó máy tính chưa có đơn: máy tính nhớ lại mã và giờ quét (tối đa 30 ngày). Khi nạp file sàn hoặc thêm đơn làm đơn đó xuất hiện, máy tính tự chuyển đơn sang "Hàng đã trả" với giờ nhận là giờ quét thật rồi báo trên màn hình. Mã trùng nhiều đơn thì giữ lại để kiểm tra, không tự khớp.

            ### Bản sửa 1.9.11

            - Chống trùng và công cụ Dọn Đơn Trùng so theo mã vận đơn trước; mã đơn chỉ dùng khi một bên chưa có mã vận đơn. Nhờ vậy đơn hoàn lần 2 của cùng một mã đơn (mã vận đơn hoàn khác) không bị bỏ qua hay xóa nhầm.

            ### Bản sửa 1.9.10

            - Điện thoại tạo đơn mới, tạo đơn hủy hoặc đẩy ra Bảng chính: đơn đã có ở Bảng chính, Kho lưu trữ hoặc Bảng đơn hủy thì máy tính báo "ĐÃ CÓ Ở …" và không tạo lại. Nhập từ Hộp Đơn Mới trên máy tính cũng bỏ qua đơn trùng.

            ### Bản sửa 1.9.9

            - Nạp file Shopee/TikTok: đơn đã có ở Kho lưu trữ hoặc Bảng đơn hủy không còn bị đẩy lại ra Bảng chính như đơn mới.
            - Thêm công cụ Hệ Thống → "Dọn Đơn Trùng Giữa Các Bảng" để xóa các bản trùng đã lỡ vào Bảng chính (có hỏi xác nhận, giữ đơn đang khóa, có lưu bản sao).

            ### Bản sửa 1.9.8

            - iPhone sửa đơn (sản phẩm, màu, size, số lượng, trạng thái, loại đơn) hoặc xóa đơn thì máy tính làm theo (đơn bị khóa thì từ chối, đơn xóa được lưu bản sao trong bộ nhớ). Sửa/xóa đơn trên máy tính thì danh sách trên iPhone tự cập nhật sau vài giây.

            ### Bản sửa 1.9.7

            - Theo dõi và ghi chú đồng bộ 2 chiều với iPhone: sửa lý do theo dõi/bỏ theo dõi trên máy tính thì iPhone tự cập nhật; sửa trên iPhone (thay hẳn nội dung cũ, có công tắc theo dõi) thì máy tính cập nhật.

            ### Bản sửa 1.9.6

            - Nhận ghi chú đơn từ iPhone: đơn đó tự được đánh dấu theo dõi và ghi chú được lưu làm lý do theo dõi (hiện ở Bảng Theo Dõi).

            ### Bản sửa 1.9.5

            - Gửi kèm mức cảnh báo Báo Đỏ (từ 72 giờ) / Báo Vàng (từ 48 giờ) tính đúng như cột Hạn Cần Xử Lý để iPhone đếm "Quá hạn" và "Sắp đến hạn" khớp với máy tính.

            ### Bản sửa 1.9.4

            - Gửi kèm bảng đối chiếu số đơn (bảng chính, đã nhận, đang chờ, theo dõi, đặt trước, đơn hủy, kho lưu trữ, số đơn bị bỏ do thiếu mã) để iPhone so với số nó nhận và chỉ ra chỗ lệch.

            ### Bản sửa 1.9.3

            - Gửi sang app iPhone TOÀN BỘ đơn thay vì chỉ đơn chưa nhận: đơn đã nhận, kho lưu trữ, bảng đơn hủy (và đơn ở bảng chính có loại đơn là Đơn hủy), hàng đặt trước, đơn đang theo dõi kèm lý do theo dõi và ghi chú. iPhone chia mục và đếm số đơn từng mục.

            ### Bản sửa 1.9.2

            - Gửi danh sách đơn sang iPhone: MQTT gửi trước, nhanh và gửi 2 lượt để bù mảnh bị rớt; ntfy chạy nền có hạn chờ nên mạng chặn/chậm ntfy.sh không còn làm treo việc gửi (trước đây mỗi mảnh phải chờ ntfy nên điện thoại chỉ nhận được vài mảnh).

            ### Bản sửa 1.9.1

            - Danh sách đơn gửi sang app iPhone giờ đi qua cả MQTT (không chỉ ntfy.sh), để iPhone ở mạng chặn ntfy.sh vẫn nhận được. Một lỗi ntfy không còn làm dừng việc gửi. Máy tính bỏ qua các bản tin do chính nó gửi vọng lại trên MQTT.

            ### Bản sửa 1.9.0

            - Gửi danh sách đơn chờ hoàn (kèm màu, size, hạn xử lý) sang app iPhone gốc: tự gửi khi điện thoại kết nối, khi điện thoại yêu cầu cập nhật và mỗi 10 phút. App iPhone dùng dữ liệu này để tra cứu, cảnh báo đơn sắp quá hạn và gợi ý ngay khi quét.

            ### Bản sửa 1.8.38

            - Bảng đơn hủy: thêm nút "Tạo đơn hủy", ô tích chọn từng đơn / chọn tất cả với thao tác hàng loạt (đánh dấu đã nhận, chưa nhận, xóa), thêm cột Màu và Size, bỏ cột Ngày gửi, Hạn xử lý, Trạng thái sàn, Hàng đặt trước.
            - Trạng thái nhận đổi được bằng tay: chuyển sang Đã nhận thì ghi ngày về kho, chuyển sang Chưa nhận thì xóa ngày về kho.
            - Đơn hủy quét từ điện thoại mặc định là Đã nhận và có ngày về kho.
            - Nhập file đơn hủy tách Màu / Size từ cột "Tên phân loại hàng".
            - Điện thoại: loại mã cần quét mặc định là Tự động.

            ### Bản sửa 1.8.37

            - Thông báo có thêm tab "⏰ Hạn Xử Lý": liệt kê từng đơn chưa về đã gần hạn hoặc quá hạn, ghi rõ "Sắp đến hạn: còn X giờ" / "Quá hạn N ngày Y giờ", quá hạn lâu nhất lên đầu, có nút Định Vị Đơn (cả bảng chính và bảng đơn hủy).
            - Mở Thông báo lần đầu sẽ tự vào tab này nếu có đơn cần xử lý; có toast nhắc khi kiểm tra hạn; kiểm tra lại sau khi nạp dữ liệu xong.

            ### Bản sửa 1.8.36

            - Lưu TOÀN BỘ dữ liệu ra ổ cứng: kho lưu trữ, bảng đơn hủy, hộp đơn mới, danh mục, thông báo... ghi ra file trong thư mục dữ liệu ngay khi có thay đổi (trễ khoảng 0,3 giây); khi mở app mà bộ nhớ trống thì tự khôi phục từ ổ cứng. Ảnh đơn hủy cũng ghi thành file.
            - Sao lưu tự động: mỗi 2 giờ chép dữ liệu vào thư mục sao_luu_tu_dong/<ngày>, giữ 7 ngày gần nhất.

            ### Bản sửa 1.8.35

            - Ô tìm kiếm bảng chính nay cũng tìm trong Kho lưu trữ và Bảng đơn hủy: dưới dòng thông báo đơn khớp hiện thêm đơn khớp ở bảng nào kèm nút "Đi đến vị trí" (tự mở bảng, nhảy đúng trang, tô xanh dòng đơn).
            - Thông báo: cảnh báo đơn sắp đến hạn (trên 2 ngày) và quá hạn (trên 3 ngày) mà chưa về kho, gồm cả đơn hủy chưa nhận; mỗi đơn mỗi mức chỉ báo 1 lần, nằm trong nhóm "Cảnh báo".

            ### Bản sửa 1.8.34

            - Tạo đơn hủy trên điện thoại gửi kèm ảnh (như quét hoàn kho) để xem mã đơn hàng đối chiếu; Bảng đơn hủy có cột Ảnh đơn hàng, bấm để phóng to.
            - Tạo đơn mới không gửi ảnh nữa (ảnh nằm ở bước quét hoàn kho).

            ### Bản sửa 1.8.33

            - Điện thoại: lịch sử tách riêng 3 mục (quét hoàn kho / tạo đơn mới / tạo đơn hủy), mỗi mục chỉ hiện nút lọc phù hợp (Hợp lệ, Quét trùng, Không có, Chờ nạp PC; đơn hủy không có "Không có"). Xóa lịch sử chỉ xóa đúng mục.
            - Tạo đơn mới: quét trùng báo "đã có trong Bảng đơn mới"; thêm nút ⬆️ Đẩy ra bảng chính cạnh nút xóa.
            - Camera: nút ⏸ Dừng / ▶ Tiếp tục để tắt tạm camera, tránh nóng máy.

            ### Bản sửa 1.8.32

            - Mới: 🚫 BẢNG ĐƠN HỦY riêng (nút trên thanh đầu): nhập file chỉ vào bảng này, có tìm kiếm, lọc, tổng SL/giá trị cuối bảng; không có cột ghi chú người mua, lý do hoàn/hủy, ghi chú của tôi; loại đơn mặc định "Đơn hủy".
            - Điện thoại: nút "TẠO ĐƠN HỦY" cạnh "TẠO ĐƠN MỚI"; quét là tự vào bảng, quét trùng báo đã tạo, có lịch sử đã tạo.
            - Quét nhận hàng trên điện thoại đối chiếu cả Bảng chính lẫn Bảng đơn hủy.

            ### Bản sửa 1.8.31

            - Máy quét điện thoại: thêm lượt đọc sâu cho tem nghiêng bất kỳ góc, in nhạt hoặc hơi mờ (vẫn kiểm tra checksum, cần 2 lần khớp).
            - iPhone: dùng ZXing (WASM) nếu tải được và tự kiểm tra ổn; nếu không thì quay về bộ đọc cũ.

            ### Bản sửa 1.8.30

            - Bấm 1 lần vào Mã đơn hàng là sao chép luôn (có báo nhỏ ở góc), không mở hộp thoại; nhấp đúp vẫn để chỉnh sửa.
            - Bỏ dòng tổng thừa ở chân bảng; bảng đơn hàng chiếm hết phần màn hình còn lại nên thấy được nhiều dòng hơn.
            - Hàng tuần / sàn gọn hơn: bỏ nhãn thừa, bỏ khung "ĐANG QUẢN LÝ", bỏ cụm nút Chế độ (bảng thống kê mở bằng nút ở thanh dưới cùng). Các ô trạng thái bớt màu.
            - Thêm ô "Đến trang" ở góc trái: nhập số trang rồi Enter (hoặc bấm Đi) để tới thẳng trang đó.

            ### Bản sửa 1.8.29

            - Trang chính mặc định chỉ hiện danh sách đơn hàng; bảng thống kê Màu & Size chỉ hiện khi bấm nút "Xem Bảng Thống Kê Phân Loại" ở thanh dưới cùng (bấm "Bảng Đơn Hàng" để quay lại).
            - Bảng thống kê hàng hoàn chi tiết theo sản phẩm (Màu & Size) giờ tính cả các đơn đã chuyển về Kho Lưu Trữ (có nhãn "+ N đơn đã lưu trữ"); bộ lọc tuần / sàn / loại đơn áp dụng cho cả hai.
            - Giao diện gọn hơn: các bộ lọc phụ (Loại đơn, Trước/Thường, Mã vận đơn, Ngày, Giờ) gom vào nút "Bộ lọc nâng cao" (thu gọn mặc định, hiện số bộ lọc đang bật).
            - Bỏ thanh tổng bị lặp ở chân bảng; số đơn, SP, đã về, chưa về, không cần nhận, tiền hiện ở một thanh tổng cuối màn hình.
            - Ô tìm kiếm: khi không có đơn khớp trong tuần/sàn/loại đang chọn nhưng có ở mục khác, thanh báo ghi rõ đơn nằm ở sàn/tuần nào và có nút "Xem trong tất cả".

            ### Bản sửa 1.8.28

            - Mã đơn Shopee dạng "số + E + số" (vd 26111238E12345) không còn bị hiểu nhầm là số khoa học và nối thêm hàng nghìn số 0 làm bảng rộng bất thường; các đơn đã bị hỏng được tự khôi phục khi mở app.

            ### Bản sửa 1.8.27

            - Nhập file Salework (don_hoan_...xlsx): đọc cột "Mã trả hàng" làm mã vận đơn hoàn về, để quét mã hoàn về tìm ra đúng đơn.

            ### Bản sửa 1.8.26

            - Ô tìm kiếm: thanh kết quả ghi rõ đơn khớp ở trường nào (mã vận đơn hoàn về, tên người mua, ghi chú, sản phẩm...).
            - Bộ lọc giờ (cả bảng chính và kho lưu trữ) dùng định dạng 24 giờ HH:mm, không còn AM/PM.
            - Quét mã khớp nhiều dòng của cùng một đơn (có yêu cầu hoàn đã hủy "Không cần nhận"): nếu chỉ còn 1 dòng cần nhận thì tự chọn dòng đó, không báo trùng.

            ### Bản sửa 1.8.25

            - Quét/nhập mã: mã đơn TikTok dài 18-19 số không còn bị cắt thành mã vận đơn J&T giả (trên điện thoại và máy tính).

            ### Bản sửa 1.8.24

            - Bảng theo dõi đơn hàng đặc biệt: mở rộng theo chiều ngang và dọc màn hình, các cột (Nhận Tại Kho, Thao Tác) hiện đủ, tên sản phẩm / lý do / trạng thái sàn xuống dòng thay vì bị cắt.

            ### Bản sửa 1.8.23

            - Điện thoại quét bớt nóng và bớt hao pin: giải mã khoảng 14 khung hình mỗi giây khi đang quét, tự hạ xuống 1 khung mỗi giây sau 25 giây không có mã mới (mã xuất hiện vẫn được đọc ngay và đánh thức lại tốc độ đầy đủ).

            ### Bản sửa 1.8.22

            - Nhập file Shopee hoàn/trả: các đơn "Hoàn tiền ngay" có cột "Tổng số tiền Hoàn trả" = 0 không còn bị nhập giá 0; app lấy cột giá kế tiếp có giá trị (Tổng Giá Trị / Đơn Giá).

            ### Bản sửa 1.8.21

            - PC bớt bị đứng mỗi lần quét: bỏ một lần tính lại toàn bộ bảng tổng hợp bị lặp, và không vẽ lại bảng lần thứ hai cho ảnh nếu bảng vừa được vẽ lại sau khi ảnh tới.
            - Điện thoại không gửi thêm yêu cầu ntfy cho mỗi lần quét khi MQTT đang chạy và ntfy chưa từng nhận được tin nào trên máy này (ntfy có thể bị chặn); tự gửi lại nếu MQTT mất kết nối.

            ### Bản sửa 1.8.20

            - Bản tin quét gửi qua MQTT chỉ còn phần nhỏ (không kèm ảnh); ảnh gửi riêng đúng một lần. Trước đây ảnh bị gửi lặp nhiều lần (tới cả 3 broker) cùng bản tin quét nên xác nhận phải chờ ảnh tải lên qua 4G.
            - Các mảnh ảnh qua ntfy chỉ dùng làm dự phòng (khi không có MQTT hoặc sau 7 giây chưa được xác nhận), không còn gửi dồn mỗi lần quét.
            - PC vẽ lại bảng 20.000 dòng một lần cho cả loạt ảnh thay vì mỗi ảnh một lần.
            - Phản hồi báo thêm "PC bị treo ~X ms" khi cửa sổ PC bị đứng, để biết PC có đang bận không.

            ### Bản sửa 1.8.19

            - Bỏ lượt "preflight" thừa trước mỗi lần gửi tin qua ntfy (đổi header Title thành tham số trên đường dẫn): bớt một vòng đi-về tới máy chủ ở mỗi chiều.
            - Thêm nút "⏱ Đo tốc độ kênh" trên điện thoại: đo vòng đi-về điện thoại ↔ PC trên từng kênh (ntfy, emqx, hivemq, mosquitto) để biết kênh nào chậm hoặc bị chặn.

            ### Bản sửa 1.8.18

            - Nhập file Shopee/TikTok nhanh hơn rất nhiều khi bảng đã có hàng chục nghìn đơn (100 dòng vào bảng 20.000 đơn: từ ~12,7 giây xuống ~0,5 giây).
            - Tra mã trong dữ liệu sàn (kể cả khi quét điện thoại) gần như tức thì thay vì ~100 ms mỗi lần.
            - Kết quả ghép đơn không đổi; có test so sánh trực tiếp với cách cũ.

            ### Bản sửa 1.8.17

            - Điện thoại và PC kết nối đồng thời tới 3 broker MQTT công cộng (EMQX, HiveMQ, Mosquitto); kênh nào về trước thì dùng, bản trùng tự bỏ.
            - Điện thoại ghi rõ phản hồi đến qua kênh nào (ntfy, emqx, hivemq, mosquitto) để biết kênh nào nhanh nhất.

            ### Bản sửa 1.8.16

            - Gộp vẽ lại bảng khi quét liên tiếp, hoãn bản sao IndexedDB, gửi dữ liệu lưu dạng chuỗi JSON để PC phản hồi nhanh hơn.
            - Điện thoại hiển thị thời gian PC xử lý và thời gian mạng + chờ.

            ### Bản sửa 1.8.15

            - Điện thoại đọc mã vạch Code 128 (đa số mã vận đơn) bằng bộ đọc nhanh thuần JS, không còn phải chờ Quagga; mã không đọc được vẫn chuyển sang bộ đọc cũ.
            - Chỉ nhận mã khi checksum đúng và hai lần đọc khớp nhau.

            ### Bản sửa 1.8.14

            - PC xác nhận mã quét nhanh hơn rất nhiều khi có hàng chục nghìn đơn: ảnh lưu thành từng file riêng, file dữ liệu chính không còn chứa ảnh.
            - Các lần lưu liên tiếp được gộp, tra cứu mã vận đơn có bộ nhớ đệm.
            - Điện thoại hiện số mã chưa được PC xác nhận và tạm dừng nhận mã mới khi PC online nhưng quá chậm.
            - Vẫn chỉ báo "đã về kho" sau khi dữ liệu đã được ghi xuống ổ cứng.

            ### Bản sửa 1.8.13

            - Trả rõ kết quả nhận kho/không tồn tại, lấy receipt dự phòng khi realtime bị mất; ảnh gửi ngầm.
            - Bộ nhận diện mã vạch/QR dự phòng chạy ngay, không chờ native decoder chậm.
            - Mở kênh nhận ACK sớm; reconnect gửi lại yêu cầu chưa xác nhận; retry cùng ID không ghi trùng.
            - Mobile mặc định quét hoàn kho, tách hàng đợi tạo mới/đối soát và trả đúng cảnh báo trùng.
            - Sửa bộ lọc số lượng hoàn 0 trong file Shopee Order.cancelled/Order.failed_delivery.
            - Sửa nhận diện cột, số lượng hoàn, đơn giá/tổng tiền, trạng thái và mã hoàn bổ sung.
            - Chọn đúng sheet, nhập nhiều schema riêng, loại chồng lặp giữa file.
            - Nhập bổ sung SKU hoặc thay snapshot rõ ràng; báo kết quả sau lưu, rollback khi lỗi.
            - Bao gồm sửa kiện hoàn và đồng bộ điện thoại của 1.8.8; cần cập nhật cả PC/mobile.
            - Kiểm thử thực tế Windows/iPhone/4G cần nghiệm thu riêng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
