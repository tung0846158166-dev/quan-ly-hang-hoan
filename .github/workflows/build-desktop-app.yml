name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const code = m[1].trim();
                if (!code || m[0].includes('application/json') || m[0].includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx);
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.2.3
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.3
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.2.3 (Nạp Chuẩn 100% File Xuất Salework / TikTok Shop / Shopee & Đơn Nhiều Sản Phẩm)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.2.3

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.2.3`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.2.3.exe`)
            - **Điểm nâng cấp & tối ưu trong v1.2.3**:
              1. 📥 **Tương thích 100% với file xuất đơn hàng từ Salework / TikTok Shop / Shopee**:
                 - **Gộp trọn vẹn đơn nhiều sản phẩm (2 - 5 SP/đơn)**: Tự động nhận diện các dòng sản phẩm thứ 2, 3 (bị để trống Mã đơn & Mã vận đơn ở các dòng tiếp theo) và gộp chính xác vào cùng 1 đơn hàng, không bị sót bất kỳ sản phẩm nào.
                 - **Khôi phục Mã đơn hàng bị dạng số khoa học (`5.8702686118684454e+17`)**: Tự động chuyển về chuỗi số nguyên chuẩn (`587026861186844540`).
                 - **Đọc chuẩn định dạng Ngày & Giờ của Salework (`HH:MM:SS DD/MM/YYYY`)**: Tự động lấy ngày từ `Thời gian gửi` ➔ `Thời gian đóng` ➔ `Thời gian xử lý` ➔ `Ngày tạo đơn` và `Ngày giao hàng thành công` (đối với đơn `THẤT THU`).
                 - **Làm sạch Tên sản phẩm & Phân loại (`Tên phân loại trên sàn`)**: Tự động cắt bỏ phần phân loại bị nối lặp ở đuôi Tên sản phẩm và loại bỏ hậu tố `- Premium Cao Cấp` / `( Premium )` để tách riêng **Tên SP**, **Màu sắc**, **Size** chuẩn xác cho bảng tổng kết kho.
                 - **Tự động nhận diện Sàn `TikTok Shop`, ĐVVC `Best Express` (`TTVN...`), `J&T Express` (`8626...`) và cột `Tổng giá trị` thực tế**.
              2. 🎨 **Giao diện tinh gọn & chống lag tuyệt đối**: Giữ trọn các nâng cấp giao diện gọn gàng và cơ chế ghi ổ cứng bất đồng bộ siêu mượt của bản `v1.2.2`.
              3. 💾 **Giữ nguyên 100% dữ liệu cũ**: Cài đè trực tiếp lên bản đang dùng, toàn bộ đơn hàng và hình ảnh trong `Documents\QuanLyHangHoan\du_lieu_hang_hoan.json` được giữ nguyên vẹn.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
