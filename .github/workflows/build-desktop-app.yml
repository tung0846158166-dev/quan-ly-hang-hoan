name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master, fix/audit-17-regressions, fix/return-parcels-sync, fix/phone-ack-recovery, fix/phone-result-delivery ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Acquire production SheetJS engine for real workbook tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $enginePath = Join-Path $env:RUNNER_TEMP 'sheetjs-engine.cjs'
          Invoke-WebRequest -Uri 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js' -OutFile $enginePath
          node -e "const x=require(process.argv[1]); if(x.version!=='0.20.1') throw new Error('Unexpected SheetJS engine version: '+x.version); console.log('SheetJS '+x.version);" $enginePath

      - name: Test storage, phone, Excel and UI regressions
        run: npm test
        env:
          XLSX_ENGINE_PATH: ${{ runner.temp }}/sheetjs-engine.cjs

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.8.29
          path: |
            dist/*.exe
            dist/*.blockmap
            mobile_scanner.html
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.29
          name: "Quản Lý Hàng Hoàn v1.8.29 — giao diện gọn hơn: bộ lọc nâng cao thu gọn, một thanh tổng, tìm kiếm báo rõ đơn ở đâu"
          body: |
            ### Bản sửa 1.8.29

            - Trang chính mặc định chỉ hiện danh sách đơn hàng; bảng thống kê Màu & Size chỉ hiện khi bấm nút "Xem Bảng Thống Kê Phân Loại" ở thanh dưới cùng (bấm "Bảng Đơn Hàng" để quay lại).
            - Giao diện gọn hơn: các bộ lọc phụ (Loại đơn, Trước/Thường, Mã vận đơn, Ngày, Giờ) gom vào nút "Bộ lọc nâng cao" (thu gọn mặc định, hiện số bộ lọc đang bật).
            - Bỏ thanh tổng bị lặp ở chân bảng; số đơn, SP, đã về, chưa về, không cần nhận, tiền hiện ở một thanh tổng cuối màn hình.
            - Ô tìm kiếm: khi không có đơn khớp trong tuần/sàn/loại đang chọn nhưng có ở mục khác, thanh báo ghi rõ đơn nằm ở sàn/tuần nào và có nút "Xem trong tất cả".

            ### Bản sửa 1.8.28

            - Mã đơn Shopee dạng "số + E + số" (vd 26111238E12345) không còn bị hiểu nhầm là số khoa học và nối thêm hàng nghìn số 0 làm bảng rộng bất thường; các đơn đã bị hỏng được tự khôi phục khi mở app.

            ### Bản sửa 1.8.27

            - Nhập file Salework (don_hoan_...xlsx): đọc cột "Mã trả hàng" làm mã vận đơn hoàn về, để quét mã hoàn về tìm ra đúng đơn.

            ### Bản sửa 1.8.26

            - Ô tìm kiếm: thanh kết quả ghi rõ đơn khớp ở trường nào (mã vận đơn hoàn về, tên người mua, ghi chú, sản phẩm...).
            - Bộ lọc giờ (cả bảng chính và kho lưu trữ) dùng định dạng 24 giờ HH:mm, không còn AM/PM.
            - Quét mã khớp nhiều dòng của cùng một đơn (có yêu cầu hoàn đã hủy "Không cần nhận"): nếu chỉ còn 1 dòng cần nhận thì tự chọn dòng đó, không báo trùng.

            ### Bản sửa 1.8.25

            - Quét/nhập mã: mã đơn TikTok dài 18-19 số không còn bị cắt thành mã vận đơn J&T giả (trên điện thoại và máy tính).

            ### Bản sửa 1.8.24

            - Bảng theo dõi đơn hàng đặc biệt: mở rộng theo chiều ngang và dọc màn hình, các cột (Nhận Tại Kho, Thao Tác) hiện đủ, tên sản phẩm / lý do / trạng thái sàn xuống dòng thay vì bị cắt.

            ### Bản sửa 1.8.23

            - Điện thoại quét bớt nóng và bớt hao pin: giải mã khoảng 14 khung hình mỗi giây khi đang quét, tự hạ xuống 1 khung mỗi giây sau 25 giây không có mã mới (mã xuất hiện vẫn được đọc ngay và đánh thức lại tốc độ đầy đủ).

            ### Bản sửa 1.8.22

            - Nhập file Shopee hoàn/trả: các đơn "Hoàn tiền ngay" có cột "Tổng số tiền Hoàn trả" = 0 không còn bị nhập giá 0; app lấy cột giá kế tiếp có giá trị (Tổng Giá Trị / Đơn Giá).

            ### Bản sửa 1.8.21

            - PC bớt bị đứng mỗi lần quét: bỏ một lần tính lại toàn bộ bảng tổng hợp bị lặp, và không vẽ lại bảng lần thứ hai cho ảnh nếu bảng vừa được vẽ lại sau khi ảnh tới.
            - Điện thoại không gửi thêm yêu cầu ntfy cho mỗi lần quét khi MQTT đang chạy và ntfy chưa từng nhận được tin nào trên máy này (ntfy có thể bị chặn); tự gửi lại nếu MQTT mất kết nối.

            ### Bản sửa 1.8.20

            - Bản tin quét gửi qua MQTT chỉ còn phần nhỏ (không kèm ảnh); ảnh gửi riêng đúng một lần. Trước đây ảnh bị gửi lặp nhiều lần (tới cả 3 broker) cùng bản tin quét nên xác nhận phải chờ ảnh tải lên qua 4G.
            - Các mảnh ảnh qua ntfy chỉ dùng làm dự phòng (khi không có MQTT hoặc sau 7 giây chưa được xác nhận), không còn gửi dồn mỗi lần quét.
            - PC vẽ lại bảng 20.000 dòng một lần cho cả loạt ảnh thay vì mỗi ảnh một lần.
            - Phản hồi báo thêm "PC bị treo ~X ms" khi cửa sổ PC bị đứng, để biết PC có đang bận không.

            ### Bản sửa 1.8.19

            - Bỏ lượt "preflight" thừa trước mỗi lần gửi tin qua ntfy (đổi header Title thành tham số trên đường dẫn): bớt một vòng đi-về tới máy chủ ở mỗi chiều.
            - Thêm nút "⏱ Đo tốc độ kênh" trên điện thoại: đo vòng đi-về điện thoại ↔ PC trên từng kênh (ntfy, emqx, hivemq, mosquitto) để biết kênh nào chậm hoặc bị chặn.

            ### Bản sửa 1.8.18

            - Nhập file Shopee/TikTok nhanh hơn rất nhiều khi bảng đã có hàng chục nghìn đơn (100 dòng vào bảng 20.000 đơn: từ ~12,7 giây xuống ~0,5 giây).
            - Tra mã trong dữ liệu sàn (kể cả khi quét điện thoại) gần như tức thì thay vì ~100 ms mỗi lần.
            - Kết quả ghép đơn không đổi; có test so sánh trực tiếp với cách cũ.

            ### Bản sửa 1.8.17

            - Điện thoại và PC kết nối đồng thời tới 3 broker MQTT công cộng (EMQX, HiveMQ, Mosquitto); kênh nào về trước thì dùng, bản trùng tự bỏ.
            - Điện thoại ghi rõ phản hồi đến qua kênh nào (ntfy, emqx, hivemq, mosquitto) để biết kênh nào nhanh nhất.

            ### Bản sửa 1.8.16

            - Gộp vẽ lại bảng khi quét liên tiếp, hoãn bản sao IndexedDB, gửi dữ liệu lưu dạng chuỗi JSON để PC phản hồi nhanh hơn.
            - Điện thoại hiển thị thời gian PC xử lý và thời gian mạng + chờ.

            ### Bản sửa 1.8.15

            - Điện thoại đọc mã vạch Code 128 (đa số mã vận đơn) bằng bộ đọc nhanh thuần JS, không còn phải chờ Quagga; mã không đọc được vẫn chuyển sang bộ đọc cũ.
            - Chỉ nhận mã khi checksum đúng và hai lần đọc khớp nhau.

            ### Bản sửa 1.8.14

            - PC xác nhận mã quét nhanh hơn rất nhiều khi có hàng chục nghìn đơn: ảnh lưu thành từng file riêng, file dữ liệu chính không còn chứa ảnh.
            - Các lần lưu liên tiếp được gộp, tra cứu mã vận đơn có bộ nhớ đệm.
            - Điện thoại hiện số mã chưa được PC xác nhận và tạm dừng nhận mã mới khi PC online nhưng quá chậm.
            - Vẫn chỉ báo "đã về kho" sau khi dữ liệu đã được ghi xuống ổ cứng.

            ### Bản sửa 1.8.13

            - Trả rõ kết quả nhận kho/không tồn tại, lấy receipt dự phòng khi realtime bị mất; ảnh gửi ngầm.
            - Bộ nhận diện mã vạch/QR dự phòng chạy ngay, không chờ native decoder chậm.
            - Mở kênh nhận ACK sớm; reconnect gửi lại yêu cầu chưa xác nhận; retry cùng ID không ghi trùng.
            - Mobile mặc định quét hoàn kho, tách hàng đợi tạo mới/đối soát và trả đúng cảnh báo trùng.
            - Sửa bộ lọc số lượng hoàn 0 trong file Shopee Order.cancelled/Order.failed_delivery.
            - Sửa nhận diện cột, số lượng hoàn, đơn giá/tổng tiền, trạng thái và mã hoàn bổ sung.
            - Chọn đúng sheet, nhập nhiều schema riêng, loại chồng lặp giữa file.
            - Nhập bổ sung SKU hoặc thay snapshot rõ ràng; báo kết quả sau lưu, rollback khi lỗi.
            - Bao gồm sửa kiện hoàn và đồng bộ điện thoại của 1.8.8; cần cập nhật cả PC/mobile.
            - Kiểm thử thực tế Windows/iPhone/4G cần nghiệm thu riêng.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
