name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript Syntax in HTML Files
        run: |
          node -e "
            const fs = require('fs');
            for (const file of ['Bang_Excel_Quan_Ly_Hang_Hoan_Tu_Dong_Thu_Nho_Anh.html', 'mobile_scanner.html']) {
              const html = fs.readFileSync(file, 'utf8');
              const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, idx = 0;
              while ((m = re.exec(html)) !== null) {
                idx++;
                const attrs = m[1];
                const code = m[2].trim();
                if (!code || attrs.includes('application/json') || attrs.includes('src=')) continue;
                try {
                  new Function(code);
                  console.log('✅ Syntax OK:', file, 'script block #' + idx, '(' + code.length + ' chars)');
                } catch (err) {
                  console.error('❌ Syntax Error in', file, 'block #' + idx, err);
                  process.exit(1);
                }
              }
            }
          "

      - name: Build Windows Executable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (.exe Installer)
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangHoan-Windows-Installer-v1.3.9
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.9
          name: "Bộ Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn v1.3.9 (Hộp Thoại In-App Thêm Tab Tuần 1-Click Chuẩn Xác 100% Cho Cả Desktop App & Web, Ghi Nhớ Tab Tuần & Lưu Trữ An Toàn)"
          body: |
            ### 🚀 Bản Cài Đặt Ứng Dụng Quản Lý Hàng Hoàn Shopee - TikTok v1.3.9

            - **Tên phần mềm**: Quản Lý Hàng Hoàn Shopee - TikTok (`v1.3.9`)
            - **Định dạng**: Bộ cài đặt chuẩn Windows (`Quan.Ly.Hang.Hoan.Setup.1.3.9.exe`)
            - **Các tính năng đột phá mới trong phiên bản v1.3.9**:
              1. 📅 **Tab Phân Chia Số Lượng Đơn Theo Tuần Nạp File Excel (Weekly Import Tabs)**:
                 - Tự động chia nhỏ số lượng đơn hàng theo từng tuần dựa trên **thời gian nạp file Excel vào máy tính** (không bị phụ thuộc vào ngày đặt hàng cũ).
                 - Tự động sinh các tab tuần: `🌐 Tất cả các tuần`, `📅 Tuần 45 (02/11 - 08/11)`, `📅 Tuần 44`, kèm số lượng đơn và sản phẩm của từng tuần.
                 - Bổ sung nút `➕ Thêm Tab Tuần` để tùy chọn số tuần hoặc khoảng ngày nạp theo ý muốn.
              2. ⏱️ **Hiển Thị Đầy Đủ Ngày Giờ Nạp Đơn & Tên File Excel Nguồn Trong Chi Tiết**:
                 - Bấm xem chi tiết đơn hàng (con mắt hoặc bấm đúp vào dòng): hiển thị thẻ nổi bật ghi rõ `Thời gian nạp file Excel: DD/MM/YYYY HH:mm:ss`, kèm `Tên file Excel nguồn` và `Tuần nạp file`.
              3. 📌 **Ghim Hàng Tổng Cố Định Ở Đáy Bảng (Sticky Table Footer)**:
                 - Dòng `TỔNG CỘNG TOÀN BỘ ĐƠN HÀNG HOÀN` (Tổng SL & Tổng Tiền) được ghim cố định ở đáy bảng cuộn (`sticky bottom-0`).
                 - Dù cuộn xem 1000 đơn hàng ở bất kỳ vị trí nào, dòng tổng kết luôn luôn hiển thị trước mắt, không cần phải cuộn xuống tận đáy trang!
              4. ⚡ **Chuyển Chế Độ Xem Bảng Thống Kê Phân Loại 1-Click (View Switcher Tabs)**:
                 - Thanh chuyển đổi ngay trên đầu bảng: `[📋 Bảng Danh Sách Đơn Hàng]` và `[📊 Bảng Thống Kê Phân Loại (Màu & Size)]`.
                 - Bấm tab là màn hình chuyển ngay sang Bảng Thống Kê Phân Loại 300+ SKU (Màu & Size) mà không cần cuộn trang một chút nào!
              5. 📊 **Thanh Dock Thống Kê Cố Định Mép Dưới Màn Hình (Sticky Bottom Summary Dock)**:
                 - Luôn hiển thị tổng số đơn, tổng SP, số lượng đã về kho, chênh lệch và giá trị hàng hoàn theo thời gian thực.
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
